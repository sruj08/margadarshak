      tags: [games]
      operationId: createShareCard
      summary: Create a share card from server-recomputed scores (account holders; a minor family member only with the parent's share_cards consent)
      description: |
        The server recomputes every number (client values are never accepted) and checks the card with the gamification
        allowlist (`shareCardViolations`): display name or initials, Nazar Score with counted sessions, rank, at most one
        earned badge, the optional Kerala line, a percentile only once the baseline holds 200 verified mocks, calibration
        only with the Calibrated badge. Never PII, RTO, dates, LL/DL status or failures (GAMIFICATION_ENGINE §10). Needs at
        least one Nazar-Score-eligible mock (422 `SHARE_CARD_NOT_ALLOWED` otherwise). Sharing earns no XP and unlocks
        nothing. A minor family member needs the parent's recorded consent with the `share_cards` extra (403
        `PARENT_CONSENT_REQUIRED`); anonymous device sessions cannot create cards. Links expire after 90 days.
      security:
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCardCreate' }
            example: { kind: nazar, name_display: initials, display_name: Kabir Sharma, badge_id: calibrated, kerala_line: true, show_percentile: false, locale: hi }
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCard' }
              example:
                share_card_id: shc_01JB8ZW
                kind: nazar
                url: 'https://margdarshak.example/hi/c/shc_01JB8ZW'
                image_url: 'https://api.margdarshak.example/v1/share-cards/nazar/shc_01JB8ZW.png?locale=hi'
                content: { display_name: KS, nazar_score: 61, counted_sessions: 3, rank: mohalla, badge: calibrated, kerala_line: true, percentile: null, calibration: { brier: 0.16 } }
                created_at: '2026-11-03T10:05:00Z'
                expires_at: '2027-02-01T10:05:00Z'
