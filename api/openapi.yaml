  /v1/admin/clips/{clipId}/ratings:
    post:
      x-api-id: API-55
      tags: [ecosystem]
      operationId: rateClip
      summary: Clip admin - a rater submits hazard marks blind (two independent raters; W08 is resumed and then starts clip_finalize via API-67)
      description: |
        admin:clips.rater. The rater pseudonym comes from the session, never from the body; a rater rates a clip version
        once (409 on a second submission) and sees neither the other rating nor the proposals nor the agreement until both
        are stored (NAZAR §6.2). When the rating is stored the API resumes the rater's n8n W08 wait (POST to the stored
        resume URL with `X-MD-Resume-Token`, body `{decision, rater_id, stage}`); after the second rating W08 calls API-67
        `clip_finalize`, whose `clip.agreement` step computes the ClipAgreement.
      security:
        - userBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/ClipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipRatingCreate' }
            example:
              version: 1
              review_task_id: rvt_01JB8ZS
              decision: windows_set
              marks:
                - { hazard_type: truck_left_turn, a_ms: 17800, b_ms: 22400, cue: lorry indicator on at the junction mouth, occlusion: false }
      responses:
        '201':
          description: Rating stored; n8n W08 is resumed and starts clip_finalize via API-67 once both ratings exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipRating' }
              example: { rating_id: rtg_01JB8ZX, clip_id: KL-0007, version: 1, rater: rater-01, decision: windows_set, marks: [ { hazard_type: truck_left_turn, a_ms: 17800, b_ms: 22400, cue: lorry indicator on at the junction mouth, occlusion: false } ], submitted_at: '2026-10-23T10:00:00Z' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/admin/clips/{clipId}/blur-audit:
    post:
      x-api-id: API-55
      tags: [ecosystem]
      operationId: recordClipBlurAudit
      summary: Clip admin - record the human frame-by-frame blur audit of the rendition to publish (100% of frames and 0 misses to publish)
      description: |
        admin:clips.curator acting as auditor (pseudonym from the session). The audit passes only when `frames_checked`
        reaches `frames_total` = floor(duration_ms x 30 / 1000), `misses` is 0 and `rendition_sha256` is the rendition
        that will be published (clip-pipeline `blurAuditIssues`). A failed audit turns `miss_frames` into manual masks for
        a re-blur (status back to `blurred`), and the re-blurred bytes need a new audit. The clip_finalize step
        `clip.blur_audit_check` checks it again before raw footage is deleted and the clip is published.
      security:
        - userBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/ClipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipBlurAuditCreate' }
            example: { version: 1, rendition_sha256: ee9452ab28e35f7353e840067320359376e518eb21c43d91a0a860356db7125b, frames_total: 1350, frames_checked: 1350, misses: 0, miss_frames: [] }
      responses:
        '201':
          description: Audit stored; the clip is returned with `blur_audit`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clip' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/admin/clips/{clipId}/adjudication:
    post:
      x-api-id: API-55
      tags: [ecosystem]
      operationId: adjudicateClip
      summary: Clip admin - a third person rules on every cluster when the two raters disagree
      description: |
        Only for a clip in status `adjudication` (409 `CLIP_INVALID_TRANSITION` otherwise). The adjudicator
        (admin:clips.curator) must not be one of the two raters (403 `ADJUDICATOR_IS_RATER`). They see both ratings and the
        proposals and rule on every cluster of the agreement: `not_hazard` drops it; `hazard` must carry their own mark
        (final window = median of three marks, or mean of two for a hazard only one rater marked). A proposal-only
        cluster cannot be resolved with one human mark (D-09: two humans set every final window). Resolved moves the clip
        to `rated`; otherwise it stays in `adjudication` with `adjudication.issues`.
      security:
        - userBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/ClipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipAdjudicationCreate' }
            example:
              version: 1
              reason_code: type_resolved
              decisions:
                - { cluster_id: c1, verdict: hazard, mark: { hazard_type: pedestrian_median, a_ms: 11100, b_ms: 16000 } }
                - { cluster_id: c2, verdict: hazard, mark: { hazard_type: parked_vehicle_hidden, a_ms: 13000, b_ms: 18100 } }
      responses:
        '200':
          description: Adjudication stored; the clip is returned with `adjudication` and, when resolved, its final hazards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clip' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

