  /v1/games/sessions/{sessionId}/replay:
    get:
      x-api-id: API-35
      x-proposed: true
      tags: [games]
      operationId: getGameSessionReplay
      summary: After completion, the final hazard windows of this session's clips with the analysed taps and late facts (replay scrubber)
      description: |
        NAZAR §3.2: hazard windows of mock-eligible clips reach a client only after API-35, through this endpoint. Only
        the session's owner may read it (the account holder also for a family member's session), and only once the
        session is completed (409 `SESSION_NOT_COMPLETED` before). Nazar sessions only in P2 (404 for other games). The
        clips were recorded as seen when the session started, so revealing their windows never affects a later mock.
        `clips[].analysis` is absent while the session is `pending_verification`. The device draws the full tap list from
        its own event log; the server sends the analysed facts only.
      security:
        - deviceSession: []
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Windows and analysed facts per clip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSessionReplay' }
              example:
                session_id: 0192f7a8-6b1c-7d2e-9f30-4a5b6c7d8e9f
                game_id: nazar
                status: verified
                rule: kerala_5band
                clips:
                  - ordinal: 7
                    item_ref: 'clip:KL-0007@1'
                    asset_url: 'https://media.margdarshak.example/clips/KL-0007/v1/360p.mp4?sid=0192f7a8&exp=1793610000&sig=9c2d41'
                    duration_ms: 45000
                    speed_kmh_est: 30
                    windows:
                      - { hazard_id: h1, hazard_type: truck_left_turn, a_ms: 18000, b_ms: 22500, full_marks_until_ms: 18900, occlusion: false }
                    analysis: { ordinal: 7, item_ref: 'clip:KL-0007@1', voided: null, taps: 1, max_taps_in_window: 1, early_taps: 0, false_alarms: 0, marks: 2, hazards: [ { hazard_id: h1, hazard_type: truck_left_turn, credit: 1, band: 5, tap_mt: 21900, late_s: 3, metres: 25 } ] }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The session is not completed yet (`SESSION_NOT_COMPLETED`)
          content:
