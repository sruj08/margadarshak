      x-api-id: API-32
      tags: [learn]
      operationId: submitAnswers
      summary: Submit answers in batch (offline queue sync; deduplicated by client_answer_id)
      description: |
        Correctness comes from the compute service, which holds the server answer key for the item
        `q:<question_id>:<variant_id>` (for example `q:C-LL1-001:v1`); the Go API never holds a key. With
        `family_member_id` the answers are that family member's; a minor needs the parent's recorded consent, otherwise
        403 `PARENT_CONSENT_REQUIRED`. A replayed `client_answer_id` comes back with `duplicate: true` and is not counted twice.
      security:
        - deviceSession: []
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                family_member_id: { $ref: '#/components/schemas/FamilyMemberId' }
                answers:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/AnswerSubmission' }
            example:
              answers:
                - { client_answer_id: ans_01JB8ZL, card_id: C-LL1-001, question_id: C-LL1-001, variant_id: v1, option_id: a, confidence: '100', latency_ms: 6400, answered_at: '2026-11-02T14:10:00Z', mode: practice }
      responses:
        '200':
          description: Results and updated card states
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/AnswerResult' } }
              example:
                results:
                  - { client_answer_id: ans_01JB8ZL, correct: true, rating: 4, overconfident: false, next_due_at: '2026-11-09T14:10:00Z', duplicate: false }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

