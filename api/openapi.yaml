components:
  securitySchemes:
    deviceSession:
      type: apiKey
      in: cookie
      name: md_sid
      description: 'Anonymous device session (scope `anon`), issued by API-06 as an opaque 256-bit token in the `md_sid` cookie (HttpOnly, Secure, SameSite=Lax; session record in Key Value, 180-day sliding TTL). Unsafe methods also require the header `X-Requested-With` set to `margdarshak` (CSRF defence).'
    userBearer:
      type: apiKey
      in: cookie
      name: md_sid
      description: |
        Account session: the same `md_sid` cookie after upgrade (magic link / Google), or
        `Authorization: Bearer <session token>` for non-browser clients (console scripts, tests). Role list on each operation = required scope: `user`, `helper` (acts for an
        applicant via HelperLink, `act` claim), `school`, `console`, `admin` (sub-roles
        `admin:rules.maker`, `admin:rules.checker`, `admin:clips.curator`, `admin:clips.rater`,
        `admin:moderation`, `admin:field_study`). The session record carries `age_band` and `tenant`;
        every request also sends `X-Tenant: <state code>` which must match.
    internalBearer:
      type: http
      scheme: bearer
      description: Internal scope. n8n (and Render Workflows tasks) authenticate with a per-caller service bearer token (rotated quarterly). Always combined with `internalHmac`.
    internalHmac:
      type: apiKey
      in: header
      name: Margdarshak-Signature
      description: '`t=<unix>,v1=<hex hmac-sha256(secret, t + "." + body)>`; 300 s skew window; replay cache 10 min keyed on method + path (with query) + signature, so a client re-signs every retry and two different calls signed in the same second do not collide. Used by n8n, Render Workflows and payment adapters.'

  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, pattern: '^cas_[0-9A-Z]{6,26}$' }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, pattern: '^pln_[0-9A-Z]{6,26}$' }
    OfficeId:
      name: officeId
      in: path
      required: true
      schema: { type: string, pattern: '^off_[0-9a-z_]{2,40}$' }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClipId:
      name: clipId
      in: path
      required: true
      description: Clip ID without version (clip-pipeline CLIP_ID_RE), e.g. KL-0007; operations act on the clip's current version
      schema: { type: string, pattern: '^[A-Z]{2,4}-\d{4,6}$' }
    PackId:
      name: packId
      in: path
      required: true
      schema: { type: string, pattern: '^([A-Z]{2}|IN-base)$' }
    PackVersion:
      name: version
      in: path
      required: true
      schema: { type: string }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/GameId' }
    State:
      name: state
      in: path
      required: true
      description: State/UT tenant code (two letters, e.g. JK, KL, DL)
      schema: { $ref: '#/components/schemas/StateCode' }
    StateQuery:
      name: state
      in: query
      required: false
      schema: { $ref: '#/components/schemas/StateCode' }
    FamilyMemberQuery:
      name: family_member_id
      in: query
      required: false
      description: Act for this family member (family mode). A minor needs the account holder's recorded parental consent (403 PARENT_CONSENT_REQUIRED); squads and share cards also need the matching extra.
      schema: { $ref: '#/components/schemas/FamilyMemberId' }
    SquadId:
      name: squadId
      in: path
      required: true
      schema: { type: string, pattern: '^sqd_[0-9A-Z]{6,26}$' }
    ShareCardId:
      name: shareCardId
      in: path
      required: true
      schema: { type: string, pattern: '^shc_[0-9A-Z]{6,26}$' }
    ParticipantCode:
      name: participantCode
      in: path
      required: true
      description: Pseudonymous field-study participant code (FIELD_STUDY §4)
      schema: { type: string, pattern: '^P-\d{3,4}$' }

    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key (UUIDv7 recommended). Required for API-04, API-15, API-35, API-45, API-51 and internal endpoints; optional elsewhere.
      schema: { type: string, minLength: 16, maxLength: 64 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last GET/PATCH of the case (W/"<version>")
      schema: { type: string }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, default: en }

  headers:
    Location:
      schema: { type: string }
    ETag:
      schema: { type: string }
    CacheControl:
      schema: { type: string }
    RetryAfter:
      schema: { type: integer }
    RateLimit:
      description: 'IETF draft-ietf-httpapi-ratelimit-headers, e.g. `"default";r=58;t=42`'
      schema: { type: string }
    RateLimitPolicy:
      description: 'e.g. `"default";q=60;w=60`'
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://margdarshak.example/problems/bad-request', title: Malformed request, status: 400, detail: Body is not valid JSON, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736 }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Scope or consent denies the action (including a missing parental consent for a minor family member)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://margdarshak.example/problems/parent-consent-required', title: A parent's consent is needed, status: 403, detail: This family member is under 18; the account holder must record parental consent first, code: PARENT_CONSENT_REQUIRED, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736 }
    NotFound:
      description: Not found (also returned for resources the caller may not see)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (e.g. idempotency key reused with a different body, illegal stage transition)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://margdarshak.example/problems/journey-invalid-transition', title: Event not allowed in this stage, status: 409, detail: test_passed requires stage S6 or S6F, code: JOURNEY_INVALID_TRANSITION }
    PreconditionFailed:
      description: ETag mismatch (edited on another device)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'https://margdarshak.example/problems/validation-failed'
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            errors: [ { pointer: /answers/aadhaar_number, code: prohibited_field, message_key: error.prohibited_field } ]
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit: { $ref: '#/components/headers/RateLimit' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Dependency down; client should fall back (offline draft, template debrief)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with Margdarshak extensions
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, examples: ['https://margdarshak.example/problems/validation-failed'], description: 'Placeholder host until the domain is registered (owner Backend lead, 2026-10-30)' }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Stable machine code (BACKEND.md section 14): VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, CONSENT_REQUIRED, PARENT_CONSENT_REQUIRED, NOT_FOUND, GONE_DELETED, JOURNEY_INVALID_TRANSITION, PRECONDITION_FAILED, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS, RULEPACK_UNAVAILABLE, ADAPTER_UNAVAILABLE, RATE_LIMITED, VOICE_QUOTA_EXCEEDED, SESSION_EXPIRED, REPLAY_REJECTED, PROHIBITED_FIELD, MAKER_CHECKER, INTERNAL; P2 games and gamification: NO_UNSEEN_CLIPS, SESSION_ALREADY_COMPLETED, SESSION_NOT_COMPLETED, PAYLOAD_TOO_LARGE, SQUAD_FULL, INVITE_EXPIRED, SHARE_CARD_NOT_ALLOWED; P2 clips: CLIP_INVALID_TRANSITION, RATING_ALREADY_SUBMITTED, ADJUDICATOR_IS_RATER, BLUR_AUDIT_FAILED, ACCOUNT_REQUIRED' }
        retryable: { type: boolean }
        trace_id: { type: string }
        title_key: { type: string, description: i18n key for the client to localise }
        errors:
          type: array
          items:
            type: object
            required: [pointer, code]
            properties:
              pointer: { type: string, description: RFC 6901 JSON Pointer }
              code: { type: string }
              message_key: { type: string }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
        job_id: { type: string }
        download_url: { type: string, description: 'API-61: where the export bundle can be fetched (GET /v1/me/exports/{exportId}, 24 h)' }
        expires_at: { type: string, format: date-time }
    Health:
      type: object
      required: [status, version, time]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        time: { type: string, format: date-time }
        ok: { type: boolean, description: 'True when status is ok or degraded (API-64 liveness for load balancers)' }
        commit: { type: string, description: 'Git commit SHA of the running build' }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, degraded, down] }
              latency_ms: { type: integer }
              detail: { type: string }
        adapters:
          type: object
          additionalProperties:
            type: object
            properties:
              implementation: { type: string }
              status: { type: string, enum: [ok, degraded, down] }

    StateCode:
      type: string
      pattern: '^[A-Z]{2}$'
      examples: [JK, KL, DL]
    VehicleClassCode:
      type: string
      enum: [MC50CC, MCWOG, MCWG, LMV-NT, LMV-TR, E-RICKSHAW, E-CART, MGV, HGMV, HPMV, HTV, ADAPTED]
    StageCode:
      type: string
      enum: [S0, S1, S2, S3, S4, S5, S6, S6F, S7, S8, S9]
    AgeBand:
      type: string
      enum: [under_16, '16_17', '18_25', '26_40', '41_60', 60_plus]
    UserBand:
      type: string
      enum: [u18, adult, unknown]
    Confidence:
      type: string
      enum: [high, medium, low]
    Provenance:
      type: object
      required: [source_title, verified_on, confidence, verified]
      properties:
        source_title: { type: string }
        source_url: { type: string, format: uri }
        verified_on: { type: string, format: date }
        confidence: { $ref: '#/components/schemas/Confidence' }
        verified: { type: boolean, description: 'Public inverse of the pack row flag `verify` (verified = !verify). false means usable in UI with a "verify at your RTO" banner, never citable by AI' }
        rule_pack_version: { type: string }
    RulePackRef:
      type: object
      required: [pack_id, version]
      properties:
        pack_id: { type: string }
        version: { type: string }
        base_version: { type: string }

    PlanRequest:
      type: object
      required: [state]
      additionalProperties: false
      description: 'Either `vehicles` (pictures) or `classes` (codes) is needed. DOB (or age_years) is needed for eligibility; the DOB is kept only encrypted with the 7-day plan snapshot so a case can be opened from it.'
      properties:
        state: { $ref: '#/components/schemas/StateCode' }
        dob: { type: string, format: date, description: Used only to derive age band and key birthdays; never stored raw for anonymous plans }
        dob_precision: { type: string, enum: [day, year_only, year], default: day, description: 'EC-01 Aadhaar shows year only. year (the engine value) and year_only (the profile value) are the same; with either, only the year of dob is used (31 Dec for minimum ages, 1 Jan for upper limits)' }
        age_years: { type: integer, minimum: 10, maximum: 100, description: Alternative to dob }
        vehicles:
          type: array
          minItems: 1
          maxItems: 4
          description: 'Picture IDs. The rule-pack picture IDs (classes.json) are accepted as well as the original names (scooter_gearless = scooter, motorcycle = bike_gear, light_goods = goods_light).'
          items: { type: string, enum: [scooter_gearless, moped_50cc, motorcycle, car, auto_rickshaw, e_rickshaw, light_goods, truck, bus, adapted_vehicle, scooter, scooter_50cc, bike_gear, taxi, goods_light, e_cart, goods_medium, heavy_transport] }
        classes:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/VehicleClassCode' }
        aadhaar_address_matches_residence: { type: boolean }
        aadhaar_has_relation_line: { type: boolean, description: EC-03 }
        aadhaar_mobile_linked: { type: boolean, description: F-04 contactless path needs the Aadhaar-linked mobile }
        home_test_device: { type: boolean, description: F-04 webcam device for the home LL test }
        has_test_vehicle: { type: boolean, description: F-04 vehicle for the driving test }
        already_holds_ll: { type: boolean, description: EC-22 }
        ll_issued_on: { type: string, format: date, description: EC-22 issue date of the LL already held }
        holds_dl: { type: boolean }
        holds_foreign_licence: { type: boolean, description: EC-12 }
        moving_state: { type: boolean, description: EC-12 }
        nri: { type: boolean, description: EC-12 }
        disability_needs: { type: array, items: { type: string, enum: [adapted_controls, deaf, colour_vision, low_vision, locomotor, other] } }
        language: { type: string, enum: [en, hi, doi] }
    PlanFacts:
      type: object
      additionalProperties: false
      description: 'Non-personal yes/no answers the blocker engine needs (F-04). Stored with the case; never names, numbers or addresses.'
      properties:
        aadhaar_address_matches_residence: { type: [boolean, 'null'], description: EC-02 }
        aadhaar_has_relation_line: { type: [boolean, 'null'], description: EC-03 }
        aadhaar_mobile_linked: { type: [boolean, 'null'] }
        home_test_device: { type: [boolean, 'null'] }
        has_test_vehicle: { type: [boolean, 'null'] }
        holds_foreign_licence: { type: boolean }
        moving_state: { type: boolean }
        nri: { type: boolean }
        disability_needs: { type: array, items: { type: string, enum: [adapted_controls, deaf, colour_vision, low_vision, locomotor, other] } }
    Plan:
      type: object
      description: |
        API-01 plan: the rules engine's Plan exactly as internal/rules produces it (the same JSON
        as the TypeScript mirror packages/rules and the tests/golden snapshots), plus `plan_id`,
        `quote_id` (the stored fee quote, payable through API-19 once a case is opened from the
        plan), `age_band` (canonical band) and `expires_at` (7-day snapshot). Every value carries
        its rule IDs and provenance; rows with `verify_at_rto` show the "verify at your RTO" chip.
      required: [plan_id, expires_at, rule_pack, as_of, state, age, family_mode_required, requested_classes, classes, bundles, paths,
        recommended_path, steps, max_rto_visits, documents, blockers, warnings, notices, ll_test, dl_test, hpt, offices, milestones, trace]
      properties:
        plan_id: { type: string }
        quote_id: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        rule_pack:
          type: object
          required: [pack_id, version]
          properties:
            pack_id: { type: string }
            version: { type: string }
            base_version: { type: string }
            fees_version: { type: string }
            classes_version: { type: string }
            partial: { type: boolean }
            hash: { type: string }
        as_of: { type: string, format: date, description: Server IST date the plan was computed on (EC-15) }
        state: { $ref: '#/components/schemas/StateCode' }
        age:
          type: object
          required: [years_min, years_max, band, dob_precision]
          properties:
            years_min: { type: integer }
            years_max: { type: integer }
            band: { type: string, description: 'Engine band (under_16, 16_17, 18_19, 20_39, 40_plus); age_band is the canonical one' }
            dob_precision: { type: string, enum: [day, year] }
        family_mode_required: { type: boolean, description: 'A learner under 18 uses the plan inside a parent''s account (D-13 revised)' }
        requested_classes: { type: array, items: { $ref: '#/components/schemas/VehicleClassCode' } }
        classes: { type: array, items: { $ref: '#/components/schemas/EngineClassResult' } }
        bundles:
          type: array
          description: 'Smart class planner (F-03, MD-105): classes that share one LL now and later LLs for classes possible later (EC-21)'
          items:
            type: object
            required: [bundle_no, classes, ll_from, dl_test_unlock, ll_expires_on, earliest_licence, fees, rule_ids]
            properties:
              bundle_no: { type: integer, minimum: 1 }
              classes: { type: array, items: { $ref: '#/components/schemas/VehicleClassCode' } }
              ll_from: { type: string, format: date }
              dl_test_unlock: { type: string, format: date }
              ll_expires_on: { type: string, format: date }
              earliest_licence: { type: string, format: date }
              fees: { $ref: '#/components/schemas/EngineFeeQuote' }
              rule_ids: { type: array, items: { type: string } }
        saving:
          type: [object, 'null']
          description: 'Shown only "if you would otherwise do them one after the other" (MD-105)'
          properties:
            classes_on_one_ll: { type: integer }
            applications_saved: { type: integer }
            wait_days_saved: { type: integer }
            fee_saving_paise: { type: integer }
            note_key: { type: string }
            verified: { type: boolean }
            confidence: { type: string }
            rule_ids: { type: array, items: { type: string } }
        paths:
          type: array
          items:
            type: object
            required: [path_id, recommended, ll_test_at_rto, max_rto_visits, rule_ids]
            properties:
              path_id: { type: string }
              recommended: { type: boolean }
              ll_test_at_rto: { type: boolean }
              max_rto_visits: { type: integer }
              rule_ids: { type: array, items: { type: string } }
        recommended_path: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [n, key, at_rto, done, rule_ids]
            properties:
              n: { type: integer }
              key: { type: string }
              at_rto: { type: boolean }
              visit: { type: [integer, 'null'] }
              done: { type: boolean }
              due_on: { type: [string, 'null'], format: date }
              rule_ids: { type: array, items: { type: string } }
        max_rto_visits: { type: integer, minimum: 0 }
        earliest_dates:
          type: [object, 'null']
          properties:
            ll_issue: { type: string, format: date }
            dl_test_unlock: { type: string, format: date }
            ll_expires_on: { type: string, format: date }
            earliest_licence: { type: string, format: date }
        fees: { oneOf: [ { $ref: '#/components/schemas/EngineFeeQuote' }, { type: 'null' } ] }
        documents:
          type: array
          items:
            type: object
            required: [doc_id, required, stage, rule_id, text_key, verified]
            properties:
              doc_id: { type: string }
              required: { type: boolean }
              stage: { type: string }
              rule_id: { type: string }
              text_key: { type: string }
              verified: { type: boolean }
        blockers: { type: array, items: { $ref: '#/components/schemas/EngineIssue' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/EngineIssue' } }
        notices: { type: array, items: { $ref: '#/components/schemas/EngineIssue' } }
        ll_test:
          type: object
          description: EC-10 - online_available false switches the card to "test at the RTO"
          properties:
            online_available: { type: boolean }
            where: { type: array, items: { type: string } }
            mode: { type: string, enum: [online, rto] }
            known: { type: boolean }
            questions: { type: integer }
            pass_correct: { type: integer }
            pass_pct: { type: integer }
            verified: { type: boolean }
            confidence: { type: string }
            rule_ids: { type: array, items: { type: string } }
        dl_test: { type: object, additionalProperties: true }
        hpt: { type: object, additionalProperties: true }
        offices: { type: array, items: { type: object, additionalProperties: true } }
        milestones:
          type: array
          items:
            type: object
            required: [id, due_on, rule_id]
            properties:
              id: { type: string }
              due_on: { type: string, format: date }
              rule_id: { type: string }
        trace: { type: array, items: { type: string }, description: Every rule ID that fired }
    EngineProvenance:
      type: object
      description: The engine's source chip (rule-pack row provenance)
      required: [source_title, source_url, grade, checked_on, confidence, verified]
      properties:
        source_title: { type: string }
        source_url: { type: string }
        grade: { type: string }
        checked_on: { type: string }
        confidence: { type: string }
        verified: { type: boolean }
    EngineIssue:
      type: object
      description: A blocker, warning or notice row (F-04) as the engine returns it; refs carry the EC-xx IDs
      required: [rule_id, severity, text_key, refs, verify_at_rto, provenance]
      properties:
        rule_id: { type: string }
        severity: { type: string, enum: [blocker, warning, notice] }
        text_key: { type: string }
        fix_key: { type: [string, 'null'] }
        due_on: { type: [string, 'null'], format: date }
        refs: { type: array, items: { type: string } }
        verify_at_rto: { type: boolean }
        provenance: { $ref: '#/components/schemas/EngineProvenance' }
    EngineClassResult:
      type: object
      required: [class_code, name_key, eligible, content_depth, transport, verify_at_rto, requires, flags, alternatives, prerequisites, rule_ids, provenance]
      properties:
        class_code: { $ref: '#/components/schemas/VehicleClassCode' }
        name_key: { type: string }
        eligible: { type: boolean }
        eligible_from: { type: [string, 'null'], format: date }
        reason_key: { type: [string, 'null'] }
        content_depth: { type: string, enum: [deep, thin, coming] }
        transport: { type: boolean }
        verify_at_rto: { type: boolean }
        requires: { type: array, items: { type: string } }
        flags: { type: array, items: { type: string } }
        alternatives: { type: array, items: { type: string } }
        prerequisites: { type: array, items: { type: object, additionalProperties: true } }
        rule_ids: { type: array, items: { type: string } }
        provenance: { $ref: '#/components/schemas/EngineProvenance' }
    EngineFeeQuote:
      type: object
      description: E-07 as the engine computes it from fees.json (integer paise; never a literal)
      required: [classes, lines, ll_stage_paise, subtotal_govt_fee_paise, smart_card_paise, total_paise, excludes, provenance]
      properties:
        classes: { type: array, items: { type: string } }
        lines:
          type: array
          items:
            type: object
            required: [fee_id, label_key, per, quantity, unit_paise, amount_paise, stage, rule_id]
            properties:
              fee_id: { type: string }
              label_key: { type: string }
              per: { type: string }
              class_code: { type: [string, 'null'] }
              quantity: { type: integer, minimum: 1 }
              unit_paise: { type: integer, minimum: 0 }
              amount_paise: { type: integer, minimum: 0 }
              stage: { type: string }
              rule_id: { type: string }
        ll_stage_paise: { type: integer }
        subtotal_govt_fee_paise: { type: integer }
        smart_card_paise: { type: integer }
        total_paise: { type: integer }
        state_items: { type: array, items: { type: object, additionalProperties: true } }
        retest: { type: array, items: { type: object, additionalProperties: true } }
        excludes: { type: array, items: { type: string } }
        provenance: { $ref: '#/components/schemas/EngineProvenance' }
        quote_id: { type: string, description: 'Set on the primary fees of a stored plan (fee quote store)' }
    WhatsAppSendRequest:
      type: object
      required: [phone_e164, consent]
      properties:
        phone_e164: { type: string, pattern: '^\+91[6-9]\d{9}$' }
        consent: { $ref: '#/components/schemas/ConsentChangeInline' }
        language: { type: string, enum: [en, hi] }
    NotificationAccepted:
      type: object
      required: [notification_id, status, channel]
      properties:
        notification_id: { type: string }
        status: { type: string, enum: [queued, sent, failed, suppressed_quiet_hours, suppressed_opt_out, suppressed_daily_cap] }
        channel: { $ref: '#/components/schemas/Channel' }
        template_id: { type: string }
        plan_url: { type: string, description: 'Link to the plan on our domain (the web page behind GET /v1/plans/{planId})' }
        share_url: { type: string, description: 'wa.me fallback link with the plan text and link and no phone number (works without the WhatsApp channel; MD-104)' }
        test_number: { type: boolean, description: 'True in the demo tenant, where the Meta test number reaches allow-listed recipients only' }
    Channel:
      type: string
      enum: [whatsapp, email, web_push, sms, in_app]
    ClassCatalogue:
      type: object
      required: [state, rule_pack, classes]
      properties:
        state: { $ref: '#/components/schemas/StateCode' }
        rule_pack: { $ref: '#/components/schemas/RulePackRef' }
        classes:
          type: array
          items:
            type: object
            required: [class_code, min_age_years, transport, content_depth, rule_id, provenance]
            properties:
              class_code: { $ref: '#/components/schemas/VehicleClassCode' }
              label_key: { type: string }
              min_age_years: { type: integer }
              guardian_consent_required: { type: boolean }
              medical_form_1a: { type: string, enum: [never, over_40, always] }
              transport: { type: boolean }
              content_depth: { type: string, enum: [deep, thin, coming] }
              rule_id: { type: string }
              flags: { type: array, items: { type: string } }
              provenance: { $ref: '#/components/schemas/Provenance' }
    FeeTable:
      type: object
      required: [state, rule_pack, items]
      properties:
        state: { $ref: '#/components/schemas/StateCode' }
        rule_pack: { $ref: '#/components/schemas/RulePackRef' }
        items:
          type: array
          items:
            type: object
            required: [fee_id, per, amount_paise, rule_id]
            properties:
              fee_id: { type: string }
              per: { type: string, enum: [class, attempt, class_attempt, licence, application] }
              amount_paise: { type: integer, minimum: 0 }
              rule_id: { type: string }
        quote: { $ref: '#/components/schemas/FeeQuote' }
    FeeQuote:
      type: object
      description: E-07. Computed from the rule pack in integer paise; never contains a hard-coded amount.
      required: [quote_id, currency, lines, subtotal_govt_fee_paise, total_paise, provenance]
      properties:
        quote_id: { type: string }
        currency: { type: string, const: INR }
        lines:
          type: array
          items:
            type: object
            required: [line_id, label_key, quantity, amount_paise, rule_id]
            properties:
              line_id: { type: string }
              label_key: { type: string }
              class_code: { $ref: '#/components/schemas/VehicleClassCode' }
              quantity: { type: integer, minimum: 1 }
              amount_paise: { type: integer, minimum: 0 }
              rule_id: { type: string }
        subtotal_govt_fee_paise: { type: integer, description: Before smart card }
        total_paise: { type: integer }
        excludes: { type: array, items: { type: string, enum: [state_service_charge, postage, medical_certificate, school_fees] } }
        provenance: { $ref: '#/components/schemas/Provenance' }
    Blocker:
      type: object
      description: 'One evaluated edge-case rule row (F-04). `blocker_id` is the first EC-xx the row refers to; F-04 checks that are not edge cases (mobile not linked, no home test device, test vehicle) carry their feature ID.'
      required: [blocker_id, severity, title_key, rule_id, confidence]
      properties:
        blocker_id: { type: string, pattern: '^(EC|F|D)-\d{2}$' }
        severity: { type: string, enum: [block, warn, info] }
        kind: { type: string, enum: [blocker, warning, notice], description: The rule-pack row kind }
        title_key: { type: string }
        fix_key: { type: string }
        rule_id: { type: string }
        confidence: { $ref: '#/components/schemas/Confidence' }
        verify_at_rto: { type: boolean, description: 'Row is verified=false or low confidence: show the "verify at your RTO" chip; never citable by AI' }
        refs: { type: array, items: { type: string }, description: EC / F / D references of the row }
        due_on: { type: string, format: date }
        provenance: { $ref: '#/components/schemas/Provenance' }

    DeviceSessionRequest:
      type: object
      required: [device_public_key, platform]
      properties:
        device_public_key: { type: string, description: Ed25519 public key (base64 SPKI) used for proof-of-possession on refresh }
        platform: { type: string, enum: [android_web, ios_web, desktop_web, pwa] }
        app_version: { type: string }
        lite_mode: { type: boolean }
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        language: { type: string, enum: [en, hi] }
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [magic_link, google_id_token] }
        code: { type: string }
        id_token: { type: string }
        device_session: { type: string }
    TokenPair:
      type: object
      description: Session grant. Web clients receive the opaque session in the md_sid cookie (Set-Cookie); session_token is returned only to non-browser clients that send Prefer return=token.
      required: [scope, subject, expires_at]
      properties:
        scope: { type: string, enum: [anon, user, helper, school, console, admin] }
        subject: { type: string }
        age_band: { $ref: '#/components/schemas/UserBand' }
        expires_at: { type: string, format: date-time }
        session_token: { type: [string, 'null'] }
    HelperLinkCreate:
      type: object
      required: [case_id, helper_kind, permissions, consent]
      properties:
        case_id: { type: string }
        helper_kind: { type: string, enum: [family, csc_operator, cyber_cafe] }
        permissions:
          type: array
          items: { type: string, enum: [case.read, case.write_answers, case.record_events, learn.read, letters.draft] }
        expires_in_days: { type: integer, minimum: 1, maximum: 90, default: 30 }
        consent: { $ref: '#/components/schemas/ConsentChangeInline' }
    HelperLink:
      type: object
      description: E-29
      required: [helper_link_id, case_id, helper_kind, permissions, status, expires_at]
      properties:
        helper_link_id: { type: string }
        case_id: { type: string }
        helper_kind: { type: string, enum: [family, csc_operator, cyber_cafe] }
        permissions: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, active, revoked, expired] }
        invite_code: { type: string }
        expires_at: { type: string, format: date-time }
        consent_id: { type: string }
    HelperLinkPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HelperLink' } }
        next_cursor: { type: [string, 'null'] }

    ClassSelection:
      type: object
      description: E-03
      required: [class_code, status]
      properties:
        class_code: { $ref: '#/components/schemas/VehicleClassCode' }
        status: { type: string, enum: [planned, ll_applied, ll_issued, dl_test_booked, dl_failed, dl_passed, dl_issued, withdrawn] }
        attempts: { type: integer, minimum: 0 }
    LearnerLicenceMirror:
      type: object
      description: E-04. Never the LL number in clear.
      required: [issued_on, expires_on, classes, source]
      properties:
        issued_on: { type: string, format: date }
        expires_on: { type: string, format: date }
        classes: { type: array, items: { $ref: '#/components/schemas/VehicleClassCode' } }
        number_last4: { type: string, pattern: '^[0-9A-Z]{4}$' }
        source: { type: string, enum: [user_entered, digilocker, adapter, screenshot_confirmed] }
    DrivingLicenceMirror:
      type: object
      description: E-05
      required: [valid_to_non_transport, classes, source]
      properties:
        issued_on: { type: string, format: date }
        valid_to_non_transport: { type: string, format: date }
        valid_to_transport: { type: string, format: date }
        classes: { type: array, items: { $ref: '#/components/schemas/VehicleClassCode' } }
        number_last4: { type: string }
        renewal_window_opens: { type: string, format: date }
        source: { type: string, enum: [user_entered, digilocker, adapter] }
    NextAction:
      type: object
      required: [action_id, stage, title_key]
      properties:
        action_id: { $ref: '#/components/schemas/PrimaryActionId' }
        stage: { $ref: '#/components/schemas/StageCode' }
        title_key: { type: string }
        due_at: { type: [string, 'null'], format: date-time }
        deep_link: { type: string }
    CaseCreate:
      type: object
      required: [classes]
      properties:
        plan_id: { type: string }
        state: { $ref: '#/components/schemas/StateCode' }
        classes: { type: array, minItems: 1, maxItems: 4, items: { $ref: '#/components/schemas/VehicleClassCode' } }
        path: { type: string, enum: [aadhaar_contactless, non_aadhaar_rto, adtc] }
        existing_ll: { $ref: '#/components/schemas/LearnerLicenceMirror' }
        existing_dl: { $ref: '#/components/schemas/DrivingLicenceMirror' }
        for_family_member: { type: boolean, default: false, description: F-17 family mode (applicant is the account holder's relative) }
        family_member_id: { type: string, description: 'fam_... of the family member the case is for (required with for_family_member); a minor needs the recorded parental consent (403 PARENT_CONSENT_REQUIRED)' }
        facts: { $ref: '#/components/schemas/PlanFacts' }
    JourneyState:
      type: string
      description: Persisted journey state (14-state machine, BACKEND.md section 5)
      enum: [PLAN, LL_APPLYING, HANDED_OFF, PAYMENT_PENDING, LL_TEST, BRIDGE, DL_BOOKABLE, TEST_BOOKED, TEST_FAILED, AWAITING_APPROVAL, DL_ISSUED, DL_HOLDER, LL_EXPIRED, RENEWAL_DUE]
    DisplayStage:
      type: string
      description: Derived per request; equals the journey state unless an alert overrides it (LL_EXPIRING is display-only, never stored)
      enum: [PLAN, LL_APPLYING, HANDED_OFF, PAYMENT_PENDING, LL_TEST, BRIDGE, DL_BOOKABLE, TEST_BOOKED, TEST_FAILED, AWAITING_APPROVAL, DL_ISSUED, DL_HOLDER, LL_EXPIRED, RENEWAL_DUE, LL_EXPIRING]
    PrimaryActionId:
      type: string
      enum: [START_PLAN, RESUME_STEP, OPEN_HANDOFF, CHECK_PAYMENT, TAKE_MOCK_TEST, PRACTISE_NAZAR, BOOK_TEST, OPEN_TEST_DAY, SEE_RETEST_PLAN, CHASE_APPROVAL, SHOW_CARD, RENEW]
    Case:
      type: object
      description: E-02
      required: [case_id, tenant, state, stage, display_stage, alerts, classes, version, rule_pack_version, next_action, server_time]
      properties:
        case_id: { type: string }
        tenant: { $ref: '#/components/schemas/StateCode' }
        state: { $ref: '#/components/schemas/JourneyState' }
        stage: { $ref: '#/components/schemas/StageCode', description: 'Product stage S0-S9/S6F, derived from state' }
        display_stage: { $ref: '#/components/schemas/DisplayStage' }
        alerts:
          type: array
          items: { type: string, enum: [LL_EXPIRING, DOB_YEAR_ONLY, RULES_CHANGED, SARATHI_DOWN, PAYMENT_PENDING_LONG, APPROVAL_STALLED] }
        path: { type: string, enum: [aadhaar_contactless, non_aadhaar_rto, adtc] }
        classes: { type: array, items: { $ref: '#/components/schemas/ClassSelection' } }
        answers:
          type: object
          description: Autosaved form state. Prohibited keys rejected server-side (aadhaar_number, otp, captcha, password, biometric*); personal values (name*, relation*, address*) stay in the on-device vault.
          additionalProperties: true
          propertyNames:
            not:
              pattern: '(?i)(aadhaar_?(no|num|number)|otp|captcha|password|biometric|^name|^relation|^address)'
        ll: { oneOf: [ { $ref: '#/components/schemas/LearnerLicenceMirror' }, { type: 'null' } ] }
        dl: { oneOf: [ { $ref: '#/components/schemas/DrivingLicenceMirror' }, { type: 'null' } ] }
        key_dates:
          type: object
          additionalProperties: { type: [string, 'null'], format: date }
        next_action: { $ref: '#/components/schemas/NextAction' }
        rule_pack_version: { type: string }
        version: { type: integer, minimum: 1 }
        flags: { type: array, items: { type: string, enum: [helper_linked, for_minor_family_member, deleted_pending, remedial_training_ack] } }
        for_family_member: { type: boolean }
        family_member_id: { type: [string, 'null'] }
        facts: { $ref: '#/components/schemas/PlanFacts' }
        fees: { $ref: '#/components/schemas/FeeQuote' }
        application_status:
          type: [object, 'null']
          description: 'MD-116/MD-117 status mirror read through the Sarathi adapter (Mode B only; Mode A shows null and the user reports events)'
          properties:
            mode: { type: string, enum: [A, B] }
            stage: { type: string }
            payment: { type: string, enum: [none, pending, confirmed] }
            reference_last4: { type: string }
            simulated: { type: boolean }
            as_of: { type: string, format: date-time }
        server_time: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CasePatch:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: true
          propertyNames:
            not:
              pattern: '(?i)(aadhaar_?(no|num|number)|otp|captcha|password|biometric|^name|^relation|^address)'
        classes: { type: array, items: { $ref: '#/components/schemas/VehicleClassCode' } }
        path: { type: string, enum: [aadhaar_contactless, non_aadhaar_rto, adtc] }
        facts: { $ref: '#/components/schemas/PlanFacts' }
        family_member_id:
          type: [string, 'null']
          description: 'Reassign the case to a family member (fam_...) or back to the account holder (null). Only while the case is in PLAN. A minor needs the recorded parental consent (403 PARENT_CONSENT_REQUIRED); 409 CASE_EXISTS when that member already has an open case for an overlapping class.'
    CaseEventType:
      type: string
      description: 'The six PROJECT_BRIEF status updates (ll_issued, slot_booked, test_failed, test_passed, approved, card_received) plus the BACKEND.md journey events (ll_application_started, alias application_started, handoff_done, payment_pending, payment_confirmed, ll_test_failed, reapply, renewed). Clock-driven transitions (day 30, LL expiry, renewal window) are system events, not client events.'
      enum: [ll_issued, slot_booked, test_failed, test_passed, approved, card_received, application_started, ll_application_started, handoff_done, payment_pending, payment_confirmed, ll_test_failed, reapply, renewed]
    CaseEventCreate:
      type: object
      required: [type, occurred_on]
      properties:
        type: { $ref: '#/components/schemas/CaseEventType' }
        occurred_on: { type: string, format: date, description: User-declared date; server records recorded_at with its own clock (EC-15) }
        payload:
          type: object
          properties:
            classes: { type: array, items: { $ref: '#/components/schemas/VehicleClassCode' } }
            class_code: { $ref: '#/components/schemas/VehicleClassCode' }
            test: { type: string, enum: [ll, dl] }
            office_id: { type: string }
            slot_date: { type: string, format: date }
            reason_codes: { type: array, items: { type: string } }
            number_last4: { type: string }
            receipt_number: { type: string, maxLength: 40 }
            valid_to: { type: string, format: date, description: 'card_received - DL validity (non-transport) printed on the card; builds the DL mirror (E-05)' }
            remedial_training_ack: { type: boolean, description: 'EC-08 - the learner confirms the remedial training the pack asks for after a fail' }
    CaseEventResult:
      type: object
      required: [event, case]
      properties:
        event:
          type: object
          properties:
            seq: { type: integer }
            type: { $ref: '#/components/schemas/CaseEventType' }
            occurred_on: { type: string, format: date }
            recorded_at: { type: string, format: date-time }
        case:
          type: object
          properties:
            case_id: { type: string }
            state: { $ref: '#/components/schemas/JourneyState' }
            stage: { $ref: '#/components/schemas/StageCode' }
            display_stage: { $ref: '#/components/schemas/DisplayStage' }
            next_action: { $ref: '#/components/schemas/NextAction' }
            version: { type: integer }
        idempotent_replay: { type: boolean, description: True when this event key was already recorded (the original result is returned) }
        timeline_changes:
          type: object
          properties:
            scheduled: { type: array, items: { type: string } }
            cancelled: { type: array, items: { type: string } }
        warnings: { type: array, items: { $ref: '#/components/schemas/Blocker' } }
    TimelineEvent:
      type: object
      description: E-12
      required: [event_id, kind, code, status]
      properties:
        event_id: { type: string }
        kind: { type: string, enum: [fact, milestone, reminder, deadline] }
        code: { type: string, examples: [LL_ISSUED, LL_DAY_25_PREP, LL_DAY_30_UNLOCK, LL_EXPIRY_M30, LL_EXPIRY_M7, TEST_EVE, RETEST_ELIGIBLE, APPROVAL_CHASE, FORM_1A_AT_40, DL_RENEWAL_M60, DL_EXPIRED, DL_EXPIRED_Y1, RULES_CHANGED], description: 'Milestone ID from timelines.json; idempotency key = {caseId}:{milestoneId}:{dueOn}' }
        occurred_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, sent, done, cancelled, superseded] }
        source: { type: string, enum: [user, helper, adapter, system] }
        rule_id: { type: string }
        idempotency_key: { type: string }
    TimelinePage:
      type: object
      required: [items, server_time]
      properties:
        server_time: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
        next_cursor: { type: [string, 'null'] }
    HandoffPack:
      type: object
      required: [case_id, step, mode, adapter, target_url, steps]
      properties:
        case_id: { type: string }
        step: { type: string, enum: [ll_application, dl_application, slot_booking, fee_payment] }
        mode: { type: string, enum: [A, B], description: A = prefilled hand-off + copy-pack (works today); B = adapter after state adoption }
        adapter: { type: string, enum: [mock, deeplink, nic] }
        simulated: { type: boolean }
        target_url: { type: string, format: uri }
        prohibited_note_key: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [order, screen_hint_key, fields]
            properties:
              order: { type: integer }
              screen_hint_key: { type: string }
              note_key: { type: string }
              fields:
                type: array
                items:
                  type: object
                  required: [label_key]
                  properties:
                    label_key: { type: string }
                    vault_key: { type: [string, 'null'], description: 'Key in the on-device vault; personal values (name, relation name, address) are filled on the device and never returned by the server' }
                    value: { type: [string, 'null'], description: 'Only non-personal values (state, classes, office)' }
                    copyable: { type: boolean }
        expires_at: { type: string, format: date-time }
        flags: { type: array, items: { type: string, enum: [outage_banner, mode_b_prefill_sent] } }
        prefill:
          type: [object, 'null']
          description: 'Mode B only (MD-116): the non-personal prefill pushed through the Sarathi adapter; personal details are captured by the state system itself'
          properties:
            status: { type: string, enum: [sent, already_sent] }
            reference_last4: { type: string }
            simulated: { type: boolean }
    AadhaarOfflineVerdict:
      type: object
      required: [signature_valid, simulated, retained_fields]
      properties:
        signature_valid: { type: boolean }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        dob_precision: { type: string, enum: [day, year_only] }
        address_state_matches: { type: boolean }
        reference_hash: { type: string }
        simulated: { type: boolean }
        retained_fields: { type: array, items: { type: string } }
    PaymentIntent:
      type: object
      required: [payment_intent_id, adapter, redirect_url, amount_paise, collected_by, status]
      properties:
        payment_intent_id: { type: string }
        adapter: { type: string, enum: [mock, sarathi_redirect, state_gateway] }
        redirect_url: { type: string, format: uri }
        amount_paise: { type: integer }
        collected_by: { type: string, const: state_gateway, description: Margdarshak never collects government fees }
        status: { type: string, enum: [redirected, pending, success, failed, expired] }
        receipt_number: { type: string }
        pending_guidance_key: { type: string }
    PhotoCheckCreate:
      type: object
      required: [case_id, item, spec_id, passed]
      additionalProperties: false
      properties:
        case_id: { type: string }
        item: { type: string, enum: [photo, signature, form_1a, address_proof, age_proof] }
        spec_id: { type: string }
        width_px: { type: integer }
        height_px: { type: integer }
        bytes: { type: integer }
        format: { type: string, enum: [jpeg, png, pdf] }
        face_detected: { type: boolean }
        background_ok: { type: boolean }
        passed: { type: boolean }
        issues: { type: array, items: { type: string, enum: [too_large, too_small, wrong_format, blurry, dark, background, face_not_centred, cropped, unknown] } }
    DocumentCheck:
      type: object
      description: E-06 (no document images stored)
      required: [check_id, case_id, item, passed, checked_at]
      properties:
        check_id: { type: string }
        case_id: { type: string }
        item: { type: string }
        spec_id: { type: string }
        passed: { type: boolean }
        issues: { type: array, items: { type: string } }
        checked_at: { type: string, format: date-time }
        label_key: { type: string, default: check.precheck_not_approval }

    OfficeKind:
      type: string
      enum: [rto, arto, adtc, csc, adtt]
    Office:
      type: object
      description: E-09
      required: [office_id, kind, name, district]
      properties:
        office_id: { type: string }
        kind: { $ref: '#/components/schemas/OfficeKind' }
        code: { type: string }
        name: { type: string }
        district: { type: string }
        location: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
        tracks: { type: array, items: { type: string, enum: [eight_track, h_track, s_track, reverse_park, gradient, automated] } }
        test_mode: { type: string, enum: [manual, automated, mixed, unknown] }
        grievance_url: { type: string, format: uri }
        sample_data: { type: boolean }
    OfficePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Office' } }
        next_cursor: { type: [string, 'null'] }
    Slot:
      type: object
      description: E-10
      required: [slot_id, office_id, kind, date, source]
      properties:
        slot_id: { type: string }
        office_id: { type: string }
        kind: { type: string, enum: [ll_test, dl_test] }
        date: { type: string, format: date }
        window: { type: string }
        capacity_band: { type: string, enum: [none, few, some, many, unknown] }
        source: { type: string, enum: [mock, crowd_reported, adapter] }
        sample_data: { type: boolean }
        simulated: { type: boolean, description: 'True for every value produced by a mock adapter (MD-043, MD-045 simulated-data chip)' }
    SlotWatchCreate:
      type: object
      required: [office_ids, kind, channels]
      properties:
        case_id: { type: string }
        office_ids: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
        kind: { type: string, enum: [ll_test, dl_test] }
        earliest: { type: string, format: date }
        latest: { type: string, format: date, description: Defaults to LL expiry minus retest buffer (EC-07) }
        channels: { type: array, items: { $ref: '#/components/schemas/Channel' } }
    SlotWatch:
      allOf:
        - $ref: '#/components/schemas/SlotWatchCreate'
        - type: object
          required: [slot_watch_id, status]
          properties:
            slot_watch_id: { type: string }
            status: { type: string, enum: [active, fired, expired, cancelled] }
            label_key: { type: string, default: slotwatch.reminder_only_no_booking }
    RtoReportCreate:
      type: object
      description: Structured fields only; no free text (D-14)
      required: [visited_on, report_type]
      additionalProperties: false
      properties:
        visited_on: { type: string, format: date }
        report_type: { type: string, enum: [visit, slots_opened, scam_offer] }
        slot_release_seen:
          type: object
          additionalProperties: false
          properties:
            weekday: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
            time_band: { type: string, enum: ['06:00-09:00', '09:00-10:00', '10:00-12:00', '12:00-15:00', '15:00-18:00', '18:00-24:00'] }
        documents_asked:
          type: array
          items: { type: string, enum: [ll_printout, rc, insurance, puc, aadhaar_physical, form_1a, photos, address_proof, other] }
        track_checked:
          type: array
          items: { type: string, enum: [eight_track, h_track, s_track, reverse_park, gradient, road_test, hpt] }
        wait_minutes_band: { type: string, enum: ['0_30', '30_60', '60_120', '120_240', '240_plus'] }
        scam_offer_kind: { type: string, enum: [setting_offer, fake_slot_sale, no_test_licence, other], description: 'EC-24; never published, routed to ACB/CPGRAMS guidance' }
    RtoReport:
      type: object
      description: E-24
      required: [report_id, office_id, status, report_type]
      properties:
        report_id: { type: string }
        office_id: { type: string }
        report_type: { type: string }
        status: { type: string, enum: [pending_moderation, published, rejected, takedown] }
        created_at: { type: string, format: date-time }
        reason_code: { type: string }
    OfficeIntel:
      type: object
      required: [office_id, window_days, k_threshold, fields]
      properties:
        office_id: { type: string }
        window_days: { type: integer }
        k_threshold: { type: integer }
        fields:
          type: array
          items:
            type: object
            required: [field, n]
            properties:
              field: { type: string, enum: [slot_release_time, documents_asked, track_checked, wait_minutes] }
              value: {}
              n: { type: integer }
              last_reported_at: { type: string, format: date-time }
              sample_data: { type: boolean }
        suppressed_fields: { type: array, items: { type: string } }
        corruption_reporting:
          type: object
          properties:
            label_key: { type: string }
            links: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string, format: uri } } } }

    LearnModule:
      type: object
      required: [module_id, title_key, kind, content_depth]
      properties:
        module_id: { type: string, examples: [LL-SIGNS, M1, M4, M19] }
        title_key: { type: string }
        kind: { type: string, enum: [ll_syllabus, survival_skill, dl_test] }
        content_depth: { type: string, enum: [deep, thin, coming] }
        games: { type: array, items: { $ref: '#/components/schemas/GameId' } }
        rule_ids: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: '#/components/schemas/Provenance' } }
        min_user_band: { $ref: '#/components/schemas/UserBand' }
    ReviewItem:
      type: object
      required: [card_id, topic_id, due_at]
      properties:
        card_id: { type: string }
        topic_id: { type: string }
        due_at: { type: string, format: date-time }
        retrievability: { type: number, minimum: 0, maximum: 1 }
        question_id: { type: string }
        variant_id: { type: string }
    AnswerSubmission:
      type: object
      required: [client_answer_id, card_id, question_id, variant_id, option_id, answered_at, mode]
      properties:
        client_answer_id: { type: string }
        card_id: { type: string }
        question_id: { type: string }
        variant_id: { type: string }
        option_id: { type: string }
        confidence: { type: string, enum: ['50', '75', '100'] }
        latency_ms: { type: integer, minimum: 0 }
        answered_at: { type: string, format: date-time }
        mode: { type: string, enum: [practice, mock, review] }
    AnswerResult:
      type: object
      required: [client_answer_id, correct, rating]
      properties:
        client_answer_id: { type: string }
        correct: { type: boolean }
        rating: { type: integer, minimum: 1, maximum: 4, description: FSRS rating (1 Again .. 4 Easy) }
        overconfident: { type: boolean }
        next_due_at: { type: string, format: date-time }
        duplicate: { type: boolean }
    Readiness:
      type: object
      required: [score, knowledge, calibration_penalty, topics, gate]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        knowledge: { type: integer, minimum: 0, maximum: 100 }
        calibration_penalty: { type: integer, minimum: 0, maximum: 10 }
        display_key: { type: string }
        topics:
          type: array
          items:
            type: object
            properties:
              topic_id: { type: string }
              weight: { type: number }
              mastery: { type: number, minimum: 0, maximum: 1 }
              coverage: { type: number, minimum: 0, maximum: 1 }
        weights_source: { type: string }
        brier: { type: number, minimum: 0, maximum: 1 }
        gate:
          type: object
          required: [threshold, met, advisory, book_anyway_visible]
          properties:
            threshold: { type: integer }
            met: { type: boolean }
            advisory: { type: boolean, const: true }
            book_anyway_visible: { type: boolean, const: true }
            reasons: { type: array, items: { type: string }, description: 'Why the gate is not met yet (e.g. readiness_below_85, no_mock_data); advisory only' }
            weak_topics: { type: array, items: { type: string }, description: Topics holding the score back }
        road_readiness: { type: object, additionalProperties: true }
        as_of: { type: string, format: date-time, description: When this readiness was computed }
        stale: { type: boolean, description: 'true when the compute service was down and the last snapshot is served' }

    GameId:
      type: string
      enum: [nazar, junction_scan, stopping_distance, blind_spot, track_twin, night_glare, hill_road, helmet_fit, golden_hour, ll_sim]
    GameMode:
      type: string
      description: game-core GameMode. `pair` replaces the earlier `duel` (two squad members play the same seed and clips; each sees only their own result, no winner).
      enum: [learn, practice, mock, pair]
    A11yMode:
      type: string
      description: game-core A11yMode
      enum: [no_audio, colour_safe, one_hand, reduced_motion, tap_only, screen_reader_alt, large_text, safe_luminance]
    ItemRef:
      type: string
      description: 'game-core ItemRef: `<kind>:<id>` with an optional `@<version>` or `:v<n>`, for example `clip:KL-0001@1`, `q:C-LL1-001:v1`, `sd:r1-40-dry`, `track:generic-8@1`. No path separators.'
      minLength: 3
      maxLength: 64
      pattern: '^[a-z]{1,8}:[A-Za-z0-9_][A-Za-z0-9_.@:-]{0,54}$'
      examples: ['clip:KL-0001@1']
    HazardType:
      type: string
      description: Nazar hazard types (NAZAR §3.3), shared by game-core HazardType, clip-pipeline HAZARD_TYPES and content/catalogue/hazard_types.json. `other` is never mock-eligible.
      enum: [bus_stop_pedestrian, door_opening, auto_cut_in, wrong_side_2w, cattle_animal, child_school, pedestrian_median, vehicle_pulling_out, truck_left_turn, junction_emerging, overtaking_oncoming, parked_vehicle_hidden, cyclist, surface_hazard, other]
    FamilyMemberId:
      type: string
      description: A family member of the caller's account (API-59), e.g. fam_01JB8ZQ
      pattern: '^fam_[0-9A-Z]{6,26}$'
    GameSessionCreate:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { $ref: '#/components/schemas/GameMode' }
        family_member_id: { $ref: '#/components/schemas/FamilyMemberId' }
        difficulty: { type: [integer, 'null'], minimum: 1, maximum: 5, description: 'Requested level for learn and practice; null uses the staircase (GAME_SDK §7). Ignored for mock, pair and study sessions' }
        drill_id: { type: string, maxLength: 48, pattern: '^DR-[A-Z]{2,3}-[A-Z0-9_-]+$', description: 'A drill from a debrief next step (content/catalogue/drills.json), e.g. DR-NAZ-OCCL-TRUCK_LEFT_TURN; narrows item selection to its hazard type or skill' }
        study:
          type: object
          description: Field-study session (FIELD_STUDY §4.3). Items come from the participant's form and the session is stored with cohort field_test. Only the session that enrolled the participant may start it.
          required: [participant_code, phase]
          additionalProperties: false
          properties:
            participant_code: { type: string, pattern: '^P-\d{3,4}$' }
            phase: { type: string, enum: [ll_mock, test, fresh] }
        pair_session_id: { type: string, format: uuid, description: 'Mode pair only: the squad member''s session whose seed and items are reused (replaces duel_seed_from)' }
        a11y_modes: { type: array, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/A11yMode' } }
        text_scale: { type: number, minimum: 1, maximum: 2, default: 1 }
        haptics: { type: boolean, default: false }
        locale: { type: string, enum: [en, hi], description: SessionContext locale; defaults from Accept-Language }
        device_class: { type: string, enum: [low, mid, high], description: From the 2-second benchmark (GAME_SDK §3) }
        offline_started_at: { type: [string, 'null'], format: date-time, description: 'Set when the session was played offline and is being registered late (seed_origin client_offline, flagged INT_OFFLINE_SEED)' }
        offline_seed: { type: integer, minimum: 0, maximum: 4294967295, description: With offline_started_at - the seed the device drew }
        offline_items: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/ItemRef' }, description: 'With offline_started_at - the precached items that were played, in order' }
    GameSessionItem:
      type: object
      description: One item of a session. `public` is the client-safe document (an LL question without its key, a scenario or track spec); answer keys and hazard windows are never in it. `reveal` carries hazard windows only for learn and practice items.
      required: [item_ref, kind, content_version]
      properties:
        item_ref: { $ref: '#/components/schemas/ItemRef' }
        kind: { type: string, pattern: '^[a-z]{1,8}$', description: 'The ItemRef kind (clip, q, sd, bs, js and track today)', examples: [clip] }
        content_version: { type: string, minLength: 1, maxLength: 24 }
        asset_url: { type: string, format: uri, description: Signed media URL for this session (clips); it expires with the session }
        poster_url: { type: string, format: uri }
        sr_alt_url: { type: string, format: uri, description: 'Audio-described still-frame alternative (screen-reader path, EC-18); labelled not the same skill as the timed test' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        bytes: { type: integer, minimum: 0 }
        public: { type: object, additionalProperties: true, description: 'Client-safe item document: the content/generated/ll-bank.client.json item for q, the game-core content document for sd, bs, js and track; absent for clips' }
        reveal: { $ref: '#/components/schemas/ItemReveal' }
        origin: { type: string, enum: [filmed, ai_generated], description: 'Clips only: how the clip was made (ADR-0013). AI-generated clips carry the AI disclosure in the player.' }
    HazardWindow:
      type: object
      description: A final hazard window of one clip (NAZAR §6.1, §6.4), API view of clip.json `hazards[]`.
      required: [hazard_id, hazard_type, a_ms, b_ms]
      properties:
        hazard_id: { type: string, maxLength: 24, examples: [h1] }
        hazard_type: { $ref: '#/components/schemas/HazardType' }
        a_ms: { type: integer, minimum: 0, description: Onset - the first frame at which a careful driver could notice the developing hazard }
        b_ms: { type: integer, minimum: 0, description: End - the last frame at which a response would still avoid the conflict }
        full_marks_until_ms: { type: integer, minimum: 0, description: 'End of the first of five equal bands, a + (b - a) / 5; late_s is measured from here' }
        occlusion: { type: boolean }
        cue:
          type: object
          description: The curator's one-line cue (clip.json cueText), once written
          properties:
            en: { type: string, maxLength: 160 }
            hi: { type: string, maxLength: 160 }
    ItemReveal:
      type: object
      description: Final hazard windows of one clip, sent only for learn and practice items (the clip then counts as seen and is never served in a mock to this subject).
      required: [hazards]
      properties:
        speed_kmh_est: { type: number, minimum: 0, maximum: 150 }
        hazards: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/HazardWindow' } }
    SessionContext:
      type: object
      description: |
        game-core SessionContext (GAME_SDK §3), converted from packages/game-core/schema/SessionContext.json. The game
        module receives it unchanged, so it keeps game-core's camelCase like SessionResult. It never carries a name, DOB,
        phone, case ID, RTO or location.
      required: [sid, gameId, mode, userBand, locale, a11y, difficulty, seed, seedOrigin, items, deviceClass, offline, serverStartIso, tenant, rulePackVersion]
      additionalProperties: false
      properties:
        sid: { type: string, format: uuid }
        gameId: { $ref: '#/components/schemas/GameId' }
        mode: { $ref: '#/components/schemas/GameMode' }
        userBand: { type: string, enum: [u18, adult] }
        locale: { type: string, enum: [en, hi] }
        a11y:
          type: object
          required: [modes, textScale, haptics]
          additionalProperties: false
          properties:
            modes: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/A11yMode' } }
            textScale: { type: number, minimum: 1, maximum: 2 }
            haptics: { type: boolean }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        seedOrigin: { type: string, enum: [server, client_offline] }
        items:
          type: array
          maxItems: 40
          items:
            type: object
            required: [ref, contentVersion]
            additionalProperties: false
            properties:
              ref: { $ref: '#/components/schemas/ItemRef' }
              contentVersion: { type: string, minLength: 1, maxLength: 24 }
              sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        deviceClass: { type: string, enum: [low, mid, high] }
        offline: { type: boolean }
        serverStartIso: { type: [string, 'null'], format: date-time, description: null when the session was created offline }
        tenant: { type: string, minLength: 2, maxLength: 16, pattern: '^[A-Z][A-Z0-9_]{1,15}$' }
        rulePackVersion: { type: string, minLength: 1, maxLength: 32 }
    GameSessionStart:
      type: object
      description: E-16 (start). Top-level fields are the API's (snake_case); `ctx` is the SessionContext the game module receives.
      required: [session_id, game_id, manifest_version, scoring_version, seed, seed_origin, difficulty, mode, items, ctx, expires_at]
      properties:
        session_id: { type: string, format: uuid }
        game_id: { $ref: '#/components/schemas/GameId' }
        manifest_version: { type: string, pattern: '^\d+\.\d+\.\d+$', description: GameManifest version (equals SessionResult.gameVersion) }
        scoring_version: { type: string, pattern: '^\d+\.\d+$', description: 'major.minor scoring version (GAME_SDK §9), stored on the session' }
        content_version: { type: string, description: contentVersion of content/generated/game-items.json the items were drawn from }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        seed_origin: { type: string, enum: [server, client_offline] }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        mode: { $ref: '#/components/schemas/GameMode' }
        items: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/GameSessionItem' } }
        ctx: { $ref: '#/components/schemas/SessionContext' }
        study:
          type: object
          description: Echo of the study block for field-study sessions
          properties:
            participant_code: { type: string, pattern: '^P-\d{3,4}$' }
            phase: { type: string, enum: [ll_mock, test, fresh] }
            form: { type: string, enum: [A, B, C] }
        label_key: { type: string }
        expires_at: { type: string, format: date-time, description: Server time + 60 min (GAME_SDK §4.4); completing later is allowed and flagged INT_SESSION_EXPIRED }
    ScoreComponent:
      type: object
      description: game-core score component (camelCase, part of SessionResult)
      required: [id, value, max, weight, explainKey]
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 40, examples: [clip_7] }
        value: { type: number }
        max: { type: number }
        weight: { type: number }
        explainKey: { type: string, maxLength: 64, examples: [nazar.clip_marks] }
    Finding:
      type: object
      description: game-core Finding (DEBRIEF_SPEC §2; camelCase, part of SessionResult). IDs come from content/catalogue/findings.json, rule IDs from rules.json (RR-*), drill IDs from drills.json.
      required: [findingId, severity, critical, ruleIds, skillId, drillIds, facts]
      additionalProperties: false
      properties:
        findingId: { type: string, maxLength: 40, examples: [NAZ_LATE_RESPONSE, BS_LEFT_OVERTAKE] }
        severity: { type: number, minimum: 0, maximum: 1 }
        critical: { type: boolean, description: Critical findings are always ranked first }
        ruleIds: { type: array, maxItems: 8, items: { type: string, maxLength: 32 }, examples: [[RR-HVY-001]] }
        skillId: { type: string, maxLength: 24, examples: [SK-M4] }
        drillIds: { type: array, maxItems: 3, items: { type: string, maxLength: 48 }, examples: [[DR-NAZ-OCCL-TRUCK_LEFT_TURN]] }
        facts:
          type: object
          description: Typed facts for templates and the debrief (snake_case keys of at most 24 characters; string values of at most 32 characters). The model never writes a digit that is not here (D-09, D-10).
          propertyNames: { type: string, pattern: '^[a-z][a-z0-9_]{0,23}$' }
          additionalProperties: { type: [number, string, boolean], maxLength: 32 }
        itemRef: { type: string, maxLength: 64, examples: ['clip:KL-0007@1'] }
    SessionScore:
      type: object
      description: game-core SessionResult.score (camelCase, part of SessionResult)
      required: [raw, max, pct, passed, passRule, components, capApplied]
      additionalProperties: false
      properties:
        raw: { type: number }
        max: { type: number }
        pct: { type: number, minimum: 0, maximum: 100 }
        passed: { type: [boolean, 'null'], description: null when the game has no pass mark }
        passRule:
          type: [object, 'null']
          description: Where the pass mark comes from (a rule-pack row such as HPT-KL or LLT-JK, or a design value); null when there is no pass mark
          required: [source, ref]
          additionalProperties: false
          properties:
            source: { type: string, enum: [rule_pack, design] }
            ref: { type: string, maxLength: 48, examples: [HPT-KL] }
        components: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/ScoreComponent' } }
        capApplied: { type: [string, 'null'], maxLength: 48, description: The score cap that was applied (for example after a critical error); null when none }
    Evidence:
      type: object
      description: game-core Evidence, one FSRS evidence item (camelCase, part of SessionResult)
      required: [cardId, correct, rating, overconfident]
      additionalProperties: false
      properties:
        cardId: { type: string, maxLength: 48, examples: ['hazard:truck_left_turn'] }
        correct: { type: boolean }
        latencyMs: { type: number }
        confidence: { type: string, enum: ['50', '75', '100'] }
        rating: { type: integer, minimum: 1, maximum: 4, description: FSRS rating (1 Again .. 4 Easy) }
        overconfident: { type: boolean }
    IntegrityReport:
      type: object
      description: game-core IntegrityReport (GAME_SDK §6.5; camelCase, part of SessionResult). `flags` holds IntegrityFlag values; below trust 0.6 a session counts for practice only and the UI says it was not counted, never that it cheated.
      required: [flags, trust, timingMode, provisional]
      additionalProperties: false
      properties:
        flags: { type: array, maxItems: 64, items: { type: string, maxLength: 32 }, examples: [[INT_REPLAY_MISMATCH]] }
        trust: { type: number, minimum: 0, maximum: 1 }
        timingMode: { type: string, enum: [rvfc, fallback, sim, none] }
        provisional: { type: boolean, description: True until the score verifier has replayed the session }
    IntegrityFlag:
      type: string
      description: game-core IntegrityFlag (GAME_SDK §6.5). IntegrityReport.flags is a bounded string so that a new flag is not a breaking change; these are the values in use.
      enum: [INT_TAB_HIDDEN, INT_CLOCK_DRIFT, INT_TIMING_FALLBACK, INT_RATE_IMPOSSIBLE, INT_REPLAY_MISMATCH, INT_SEEN_CLIP, INT_RT_ANTICIPATORY, INT_EVENT_CAP, INT_SESSION_EXPIRED, INT_OFFLINE_SEED]
    SessionResult:
      type: object
      description: |
        Game SDK SessionResult (GAME_SDK §10), converted from packages/game-core/schema/SessionResult.json (JSON Schema
        2020-12 generated from the game-core Zod schema). It keeps camelCase because it is shared byte-for-byte with
        @margdarshak/game-core and replayed by the score verifier (API_SPEC §1.1). Conversion: `anyOf [X, {type: null}]`
        is written as `type: [X, 'null']`; sub-objects are the named components SessionScore, Finding, Evidence and
        IntegrityReport; the uuid pattern on `sid` is expressed as `format: uuid`. The Go drift test
        TestOpenAPISessionResultMatchesGameCore compares this schema, refs resolved, with the game-core file.
      required: [sid, gameId, gameVersion, scoringVersion, seed, seedOrigin, difficulty, mode, score, findings, evidence, calibration, integrity, replay]
      additionalProperties: false
      properties:
        sid: { type: string, format: uuid }
        gameId: { $ref: '#/components/schemas/GameId' }
        gameVersion: { type: string, maxLength: 24, examples: [1.0.0] }
        scoringVersion: { type: string, pattern: '^\d+\.\d+$', examples: ['1.0'] }
        seed: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        seedOrigin: { type: string, enum: [server, client_offline] }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        mode: { $ref: '#/components/schemas/GameMode' }
        score: { $ref: '#/components/schemas/SessionScore' }
        findings: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/Finding' } }
        evidence: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Evidence' } }
        calibration:
          type: [object, 'null']
          description: Calibration of this session's confidence-rated answers; null when the game asked for no confidence
          required: [n, brier, overconfidence]
          additionalProperties: false
          properties:
            n: { type: integer, minimum: 0, maximum: 9007199254740991 }
            brier: { type: [number, 'null'] }
            overconfidence: { type: [number, 'null'] }
        integrity: { $ref: '#/components/schemas/IntegrityReport' }
        replay:
          type: object
          description: Seed and replay inputs as game-core carries them. In API-35 the inputs travel once, in GameSessionComplete.replay; send `inputs` here as an empty string (the server ignores this copy).
          required: [seed, inputs]
          additionalProperties: false
          properties:
            seed: { type: number }
            inputs: { type: string }
    ReplayPackage:
      type: object
      description: game-core ReplayPackage (GAME_SDK §5.3), converted from packages/game-core/schema/ReplayPackage.json. camelCase like SessionResult, because the score verifier takes these fields unchanged. `inputs` is base64 (mdr1, optionally gzip), at most 512 KB; `digest` is the sha256 of the canonical decoded events; `seed` must equal the session seed.
      required: [telemetryVersion, encoding, seed, inputs, digest, eventCount]
      additionalProperties: false
      properties:
        telemetryVersion: { type: number, const: 1 }
        encoding: { type: string, enum: [mdr1, mdr1+gzip] }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        inputs: { type: string, maxLength: 524288, pattern: '^[A-Za-z0-9+/]*={0,2}$' }
        digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        eventCount: { type: integer, minimum: 0, maximum: 5000 }
    GameSessionComplete:
      type: object
      required: [client_result, replay]
      additionalProperties: false
      properties:
        client_result: { $ref: '#/components/schemas/SessionResult' }
        replay: { $ref: '#/components/schemas/ReplayPackage' }
        commentary:
          type: object
          description: Optional record-then-score commentary (consent ai_coach); audio uploaded separately and transcribed, never stored beyond 24 h
          properties:
            audio_object_key: { type: string }
            language: { type: string, enum: [hi, en, doi] }
    CheckedSessionResult:
      type: object
      description: |
        API-35 answer. The server replay overwrites the client score (D-11). When the verifier is unavailable the session
        is stored as pending_verification and the answer is still 200 with `server_checked: false`, `provisional: true`
        and the client preview in score, findings and integrity (`integrity.provisional: true`); the
        replay_pending_sessions task re-checks it, and nothing counts (Nazar Score, XP, badges, share cards) until then.
      required: [session_id, game_id, server_checked, provisional, server_score_pct, score, findings, integrity]
      properties:
        session_id: { type: string, format: uuid }
        game_id: { $ref: '#/components/schemas/GameId' }
        server_checked: { type: boolean, description: false when the score verifier was unavailable }
        provisional: { type: boolean, description: True exactly when server_checked is false }
        client_score_pct: { type: number }
        server_score_pct: { type: [number, 'null'], description: 'The score that counts (cards, percentiles, Practice Record); null while provisional' }
        mismatch: { type: boolean }
        score: { $ref: '#/components/schemas/SessionScore' }
        findings: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/Finding' } }
        integrity: { $ref: '#/components/schemas/IntegrityReport' }
        result: { $ref: '#/components/schemas/SessionResult' }
        nazar: { $ref: '#/components/schemas/NazarSessionFacts' }
        xp_awarded: { type: [integer, 'null'], minimum: 0, description: 'XP for this session; null while provisional, and for an anonymous device session (device-only XP, GAMIFICATION_ENGINE §1)' }
        badges_awarded: { type: array, items: { $ref: '#/components/schemas/BadgeId' }, description: Badges newly earned by this session (never by sharing or opening) }
        nazar_score: { $ref: '#/components/schemas/NazarScore' }
        debrief:
          type: object
          properties:
            debrief_id: { type: string }
            status: { type: string, enum: [template_ready, ai_pending, ai_ready, ai_failed] }
            url: { type: string }
    NazarSessionFacts:
      type: object
      description: Nazar sessions only. Per-clip analysis under the product rule and whether the session counts toward the Nazar Score (GAME_SDK §6.4 - mode mock, server seed, unseen clips, trust 0.6 or more, rvfc timing, verified). Hazard windows are not included; see the replay endpoint.
      required: [rule, analysis, score_eligible]
      properties:
        rule: { type: string, enum: [kerala_5band] }
        analysis: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/NazarClipAnalysis' } }
        score_eligible: { type: boolean }
        ineligible_reasons: { type: array, items: { type: string, enum: [not_mock, offline_seed, seen_clip, low_trust, timing_fallback, provisional] } }
    NazarClipAnalysis:
      type: object
      description: One clip of a Nazar session as analysed by the score verifier (game-core analyseNazarClips, verifier `analysis.nazar_clips`), in snake_case. Never carries a window.
      required: [ordinal, item_ref, voided, taps, max_taps_in_window, early_taps, false_alarms, marks, hazards]
      properties:
        ordinal: { type: integer, minimum: 1, maximum: 40 }
        item_ref: { $ref: '#/components/schemas/ItemRef' }
        voided: { type: [string, 'null'], description: 'Why the clip scored 0 (pattern = the pattern-click rule; INT_TAB_HIDDEN; INT_CLOCK_DRIFT); null when it was scored', examples: [pattern] }
        taps: { type: integer, minimum: 0 }
        max_taps_in_window: { type: integer, minimum: 0, description: Most taps in any 1 s window (more than 3 voids the clip) }
        early_taps: { type: integer, minimum: 0, description: Taps within 1 s before an onset (logged for learn feedback; they score nothing) }
        false_alarms: { type: integer, minimum: 0 }
        marks: { type: number, minimum: 0, maximum: 10, description: Kerala marks for the clip before scaling to the format }
        hazards:
          type: array
          maxItems: 2
          items:
            type: object
            required: [hazard_id, hazard_type, credit, band, tap_mt, late_s, metres]
            properties:
              hazard_id: { type: string, maxLength: 24 }
              hazard_type: { $ref: '#/components/schemas/HazardType' }
              credit: { type: number, minimum: 0, maximum: 5, description: 'Points 0-5 under kerala_5band (a fraction 0-1 under the study''s linear rule)' }
              band: { type: [integer, 'null'], minimum: 1, maximum: 5, description: 1 is the earliest band; null when not credited }
              tap_mt: { type: [integer, 'null'], minimum: 0, description: Media time (ms) of the crediting tap; null when not credited }
              late_s: { type: [number, 'null'], minimum: 0, description: Seconds after the full-marks band (0.1 s); null when not credited }
              metres: { type: [number, 'null'], minimum: 0, description: late_s x speed / 3.6 (0.1 m); null when not credited }
    NazarScore:
      type: object
      description: The subject's Nazar Score after this session (mean Kerala marks of the latest eligible mocks; NAZAR §2); `score` is null until one exists.
      required: [score, mocks_counted]
      properties:
        score: { type: [number, 'null'], minimum: 0, maximum: 100 }
        mocks_counted: { type: integer, minimum: 0 }
    GameSessionReplay:
      type: object
      description: The replay endpoint's answer - final windows of the session's clips with the analysed facts, for the replay scrubber.
      required: [session_id, game_id, status, rule, clips]
      properties:
        session_id: { type: string, format: uuid }
        game_id: { $ref: '#/components/schemas/GameId' }
        status: { type: string, enum: [verified, pending_verification] }
        rule: { type: string, enum: [kerala_5band] }
        clips:
          type: array
          maxItems: 40
          items:
            type: object
            required: [ordinal, item_ref, duration_ms, windows]
            properties:
              ordinal: { type: integer, minimum: 1, maximum: 40 }
              item_ref: { $ref: '#/components/schemas/ItemRef' }
              origin: { type: string, enum: [filmed, ai_generated], description: How the clip was made (ADR-0013) }
              asset_url: { type: string, format: uri, description: Fresh signed media URL }
              duration_ms: { type: integer, minimum: 0 }
              speed_kmh_est: { type: number, minimum: 0, maximum: 150 }
              windows: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/HazardWindow' } }
              analysis: { $ref: '#/components/schemas/NazarClipAnalysis' }
    DebriefPoint:
      type: object
      required: [finding_id, rule_id, text]
      properties:
        finding_id: { type: string }
        rule_id: { type: string }
        text: { type: string, maxLength: 200 }
    Debrief:
      type: object
      description: E-19
      required: [debrief_id, session_id, status, source, how_you_did, where_you_lacked, what_you_could_have_done, next_drill, validator]
      properties:
        debrief_id: { type: string }
        session_id: { type: string, format: uuid }
        status: { type: string, enum: [template_ready, ai_pending, ai_ready, ai_failed] }
        source: { type: string, enum: [template, ai] }
        label_key: { type: string, enum: [debrief.auto_notes, debrief.coach_notes] }
        locale: { type: string, enum: [en, hi, hinglish] }
        how_you_did: { type: string }
        where_you_lacked: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/DebriefPoint' } }
        what_you_could_have_done: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/DebriefPoint' } }
        next_drill:
          type: object
          required: [drill_id]
          properties:
            drill_id: { type: string }
            why: { type: string }
            deep_link: { type: string }
        improved_since_last: { type: [string, 'null'] }
        rules:
          type: array
          items:
            type: object
            properties:
              rule_id: { type: string }
              text: { type: string }
              source_url: { type: string, format: uri }
              verified_on: { type: string, format: date }
        validator:
          type: object
          required: [passed, attempts]
          properties:
            passed: { type: boolean }
            attempts: { type: integer }
            violations: { type: array, items: { type: string, enum: [digit_in_text, unknown_finding, unknown_rule, unverified_rule, unknown_placeholder, top_finding_missing, tone, language, length] } }
    ClipManifestItem:
      type: object
      description: E-20 public view (clip-pipeline toClientManifestEntry, snake_case). An allowlist built field by field - no hazard windows, quiet segments, cue text, hazard count or types, rater data, speed or capture month.
      required: [item_ref, clip_id, version, duration_ms, tenant_tags, licence, attribution, media, total_bytes, mock_eligible]
      properties:
        item_ref: { $ref: '#/components/schemas/ItemRef' }
        clip_id: { type: string, pattern: '^[A-Z]{2,4}-\d{4,6}$' }
        version: { type: integer, minimum: 1 }
        duration_ms: { type: integer, minimum: 1000 }
        tenant_tags: { type: array, minItems: 1, maxItems: 8, items: { type: string, pattern: '^[A-Z]{2,3}$' } }
        city: { type: string, description: Coarse place (letters only; never a street or coordinates) }
        road_type: { type: string, enum: [urban_arterial, market_street, residential_lane, school_zone, highway, hill_road, rural_road] }
        time_of_day: { type: string, enum: [dawn, day, dusk, night] }
        weather: { type: string, enum: [clear, overcast, haze, rain, fog] }
        pov: { type: string, enum: ['2W', '4W'] }
        modules: { type: array, maxItems: 20, items: { type: string, pattern: '^M\d{1,2}$' } }
        licence: { type: string, const: CC-BY-4.0 }
        attribution: { type: string }
        media:
          type: array
          maxItems: 2
          items:
            type: object
            required: [res, bytes, sha256, url]
            properties:
              res: { type: string, enum: ['360p', '480p'] }
              bytes: { type: integer, minimum: 1 }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              url: { type: string, format: uri }
        total_bytes: { type: integer, minimum: 0, description: Bytes of the listed renditions (shown before an offline pack download) }
        mock_eligible: { type: boolean }
        curator_difficulty: { type: integer, minimum: 1, maximum: 5, description: For offline practice staircases; omitted for mock-eligible clips }
        poster_url: { type: string, format: uri }
        sr_alt_url: { type: string, format: uri, description: 'Audio-described still-frame alternative (screen-reader path, EC-18)' }
    ClipPage:
      type: object
      required: [items, manifest_version]
      properties:
        manifest_version: { type: string, description: sha256 of the canonical client manifest (clip-pipeline buildClientManifest digest); changes whenever any entry changes }
        generated_at: { type: string, format: date-time }
        licence: { type: string, const: CC-BY-4.0 }
        attribution: { type: string }
        total_bytes: { type: integer, description: Shown before an offline pack download }
        items: { type: array, items: { $ref: '#/components/schemas/ClipManifestItem' } }
        next_cursor: { type: [string, 'null'] }
    BadgeId:
      type: string
      description: The nine personal badges (GAMIFICATION_ENGINE §9; gamification BADGES B1-B9 keys). Squad Sangathan is a squad ribbon, not a badge; Golden Hour Ready replaced Rah-Veer Ready so a badge is never confused with the government scheme.
      enum: [khud_licence, pehli_baar_pass, nazar_90, calibrated, no_zone_navigator, strap_streak, night_ready, ghat_ready, golden_hour_ready]
    Achievement:
      type: object
      description: E-22
      required: [xp_total, rank, badges, streak]
      properties:
        xp_total: { type: integer }
        xp_today: { type: integer }
        xp_multiplier_today: { type: number, enum: [1.0, 0.5, 0.2] }
        rank: { type: string, enum: [gali, mohalla, shehar, highway, ghat] }
        rank_requirements: { type: object, additionalProperties: true }
        badges:
          type: array
          items:
            type: object
            properties:
              badge_id: { $ref: '#/components/schemas/BadgeId' }
              awarded_at: { type: [string, 'null'], format: date-time }
              self_declared: { type: boolean }
              label: { type: string, enum: [your_word, self_checked, counted_sessions], description: 'Label key (gamification BadgeLabel); "verified" is never used for user records' }
        streak:
          type: object
          properties:
            status: { type: string, enum: [active, repairable, archived] }
            weekly_goal: { type: integer, minimum: 2, maximum: 6 }
            this_week: { type: integer }
            weeks: { type: integer }
            freeze_tokens: { type: integer, maximum: 2 }
            archived: { type: boolean }
    SquadCreate:
      type: object
      required: [name, display_name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 40, description: Passes the PII and profanity filter }
        display_name: { type: string, minLength: 1, maxLength: 24, description: The name other members see for you (your choice; passes the same filter) }
    SquadJoin:
      type: object
      required: [invite_code, display_name]
      additionalProperties: false
      properties:
        invite_code: { type: string, maxLength: 16, examples: [SQ-4K2M] }
        display_name: { type: string, minLength: 1, maxLength: 24 }
    Squad:
      type: object
      description: E-23 (GAMIFICATION_ENGINE §8). Members see each other's display name, rank and whether they hit the weekly goal - never scores, calibration or failures.
      required: [squad_id, name, members, weekly_progress]
      properties:
        squad_id: { type: string, pattern: '^sqd_[0-9A-Z]{6,26}$' }
        name: { type: string }
        invite_code: { type: string, description: Shown to members only }
        invite_expires_at: { type: string, format: date-time, description: Invite links expire 7 days after they are issued }
        members:
          type: array
          maxItems: 5
          items:
            type: object
            required: [display_name, rank, weekly_goal_hit, role]
            properties:
              display_name: { type: string }
              rank: { type: string, enum: [gali, mohalla, shehar, highway, ghat] }
              weekly_goal_hit: { type: boolean }
              role: { type: string, enum: [owner, member] }
              is_me: { type: boolean }
        squad_score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: 'Mean of NazarScore x (1 - Brier) over members who have both, rounded; null below 3 contributors' }
        weekly_progress:
          type: object
          required: [done, goal]
          properties:
            done: { type: integer, minimum: 0 }
            goal: { type: integer, minimum: 0, description: 3 x members (gamification squadWeeklyGoal) }
        week_key: { type: string, pattern: '^\d{4}-W\d{2}$', description: IST ISO week }
        ribbon_this_week: { type: boolean, description: Everyone gets the ribbon or nobody does }
        sangathan_ribbon: { type: boolean, description: Weekly squad goal met 3 times }
    SquadPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Squad' } }
    ShareCardCreate:
      type: object
      required: [kind, name_display, display_name]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [nazar, badge], description: 'readiness and squad cards stay reserved in API-57: the gamification allowlist has no fields for them yet' }
        family_member_id: { $ref: '#/components/schemas/FamilyMemberId' }
        name_display: { type: string, enum: [display_name, initials], description: Show the display name or only its initials }
        display_name: { type: string, minLength: 1, maxLength: 24, description: 'Passes the PII filter. With initials only the initials (up to 3 letters) are stored on the card; with display_name at most 20 characters (letters, spaces, apostrophes, hyphens) are shown, else 422' }
        badge_id: { $ref: '#/components/schemas/BadgeId' }
        kerala_line: { type: boolean, default: false, description: 'Adds "Kerala''s announced pass mark: 60/100" (never a pass or fail verdict)' }
        show_percentile: { type: boolean, default: false, description: Honoured only once the baseline holds 200 verified mocks }
        locale: { type: string, enum: [en, hi], default: en }
    ShareCardContent:
      type: object
      description: The only fields a share card may carry (gamification ShareCardContent allowlist; GAMIFICATION_ENGINE §10), recomputed by the server. No PII, RTO, dates, LL/DL status or failures.
      required: [display_name, nazar_score, counted_sessions, rank]
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 24, description: Display name or initials (the user's choice) }
        nazar_score: { type: number, minimum: 0, maximum: 100 }
        counted_sessions: { type: integer, minimum: 0, description: Rendered with the label key counted_sessions (PROJECT_BRIEF §15 bans "verified" for user records) }
        rank: { type: string, enum: [gali, mohalla, shehar, highway, ghat] }
        badge: { $ref: '#/components/schemas/BadgeId' }
        kerala_line: { type: boolean }
        percentile: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        calibration:
          type: [object, 'null']
          description: Only when the chosen badge is calibrated
          properties:
            brier: { type: number, minimum: 0, maximum: 1 }
    ShareCard:
      type: object
      description: The owner's view of a share card, returned when it is created
      required: [share_card_id, kind, url, image_url, content, created_at, expires_at]
      properties:
        share_card_id: { type: string, pattern: '^shc_[0-9A-Z]{6,26}$' }
        kind: { type: string, enum: [nazar, badge] }
        url: { type: string, format: uri, description: 'The card page on our domain (${WEB_BASE_URL}/{locale}/c/{share_card_id}); never a parivahan, sarathi or gov host, never an APK link' }
        image_url: { type: string, format: uri, description: API-57 image URL (302 to the rendered PNG) }
        content: { $ref: '#/components/schemas/ShareCardContent' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: 90 days after creation }
    ShareCardPublic:
      type: object
      description: Public share-card data. No dates and nothing beyond the allowlisted content plus i18n keys for the fixed lines.
      required: [share_card_id, kind, content, image_url, footer_key]
      properties:
        share_card_id: { type: string, pattern: '^shc_[0-9A-Z]{6,26}$' }
        kind: { type: string, enum: [nazar, badge] }
        content: { $ref: '#/components/schemas/ShareCardContent' }
        image_url: { type: string, format: uri }
        tagline_key: { type: string, description: '"Rewards anticipation, not speed"' }
        footer_key: { type: string, description: '"Practice score on Margdarshak''s clips · not a licence test · independent, not affiliated with MoRTH/NIC"' }
        kerala_line_key: { type: string, description: Present when content.kerala_line is true }

    VoiceClientMessage:
      type: object
      description: API-40 client JSON frame
      required: [type]
      properties:
        type: { type: string, enum: [hello, stop, ui_state, confirm, cancel, text] }
        v: { type: integer, const: 1 }
        locale: { type: string, enum: [hi, en, doi] }
        screen: { type: string }
        caseId: { type: string }
        token: { type: string, description: ticket from POST /v1/voice/ticket (hello frame only) }
        screen_id: { type: string }
        field_values_visible: { type: object, additionalProperties: { type: string } }
        confirm_action_id: { type: string }
        text: { type: string, maxLength: 500 }
    VoiceServerMessage:
      type: object
      description: API-40 server JSON frame
      required: [type]
      properties:
        type: { type: string, enum: [transcript_in, transcript_out, ui_action, confirm_request, rule_chip, pii_blocked, interrupted, error, session_end] }
        text: { type: string }
        action:
          type: object
          properties:
            kind: { type: string, enum: [navigate, set_field, open_drill, read_back] }
            screen_id: { type: string }
            field_id: { type: string }
            value: { type: string }
            action_id: { type: string }
        rule_id: { type: string }
        reason_key: { type: string }
    CommentaryResult:
      type: object
      description: API-74. Never carries the transcript.
      required: [session_id, clip_ordinal, commentary_pct, hazards, false_mentions, findings]
      properties:
        session_id: { type: string, format: uuid }
        clip_ordinal: { type: integer, minimum: 1, maximum: 40 }
        commentary_pct: { type: number, minimum: 0, maximum: 100, description: 'hazards named in [a - 1 s, b] / hazards; shown separately from the Kerala score' }
        hazards:
          type: array
          maxItems: 2
          items:
            type: object
            required: [hazard_type, hit]
            properties:
              hazard_type: { $ref: '#/components/schemas/HazardType' }
              hit: { type: boolean }
        false_mentions: { type: integer, minimum: 0 }
        findings:
          type: array
          items:
            type: object
            required: [finding_id, severity, facts]
            properties:
              finding_id: { type: string, enum: [NAZ_COMM_MISSED_MENTION] }
              severity: { type: number, minimum: 0, maximum: 1 }
              facts: { type: object, additionalProperties: true }
    SignSnapResult:
      type: object
      description: API-75. Name and meaning come from content/catalogue/signs.json, never from the model.
      required: [status, confidence, choices]
      properties:
        status: { type: string, enum: [match, choose, not_in_catalogue] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        sign: { $ref: '#/components/schemas/SnapSign' }
        choices: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/SnapSign' } }
    SnapSign:
      type: object
      required: [sign_id, family, name, meaning, verified]
      properties:
        sign_id: { type: string, pattern: '^SIGN-[A-Z]{3}-\d{3}$' }
        family: { type: string }
        name: { type: string }
        meaning: { type: string }
        verified: { type: boolean, description: false until the two-person check against IRC:67 }
    CoachPlan:
      type: object
      description: API-76. Numbers (the weekly goal) are code values; the wording has no digits.
      required: [source, label_key, locale, headline, week_goal_sessions, items, intention_prompt, tone]
      properties:
        source: { type: string, enum: [template, ai] }
        label_key: { type: string, enum: [coach.auto_plan, coach.coach_plan] }
        locale: { type: string, enum: [en, hi, hinglish] }
        headline: { type: string, maxLength: 90 }
        week_goal_sessions: { type: integer, minimum: 1, maximum: 7 }
        items:
          type: array
          maxItems: 6
          items:
            type: object
            required: [drill_id]
            properties:
              drill_id: { type: string }
              why: { type: string }
              deep_link: { type: string }
        intention_prompt: { type: string, maxLength: 120, description: 'Contains {{slot:day}} and {{slot:time}} for the UI to fill' }
        tone: { type: string, enum: [steady, welcome_back, nearly_there] }
    CoachIntention:
      type: object
      required: [day, time, drill_id]
      properties:
        day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        drill_id: { type: string, pattern: '^DR-[A-Z0-9-]{2,40}$' }
        week_of: { type: string, format: date, readOnly: true }
    AIFeedback:
      type: object
      required: [agent, item_id, helpful]
      properties:
        agent: { type: string, enum: [debrief, tutor, coach, voice, decoder, signsnap, scam] }
        item_id: { type: string, maxLength: 80 }
        helpful: { type: boolean }
        reason: { type: string, enum: [wrong, unclear, tone, other] }
    AIAgentStats:
      type: object
      required: [agent, model, calls, failures, fallbacks, total_ms, max_ms, in_tokens, out_tokens, est_cost_micro_usd, breaker_open]
      properties:
        agent: { type: string }
        model: { type: string }
        calls: { type: integer }
        failures: { type: integer }
        fallbacks: { type: object, additionalProperties: { type: integer } }
        total_ms: { type: integer }
        max_ms: { type: integer }
        in_tokens: { type: integer }
        out_tokens: { type: integer }
        est_cost_micro_usd: { type: integer, description: Estimate from list prices; not a bill }
        breaker_open: { type: boolean }
    AIReviewCreate:
      type: object
      required: [agent, item_id, grounding, tone, usefulness]
      properties:
        agent: { type: string, enum: [debrief, tutor, coach, voice, decoder, signsnap] }
        item_id: { type: string, maxLength: 80 }
        grounding: { type: integer, minimum: 0, maximum: 2 }
        tone: { type: integer, minimum: 0, maximum: 2 }
        usefulness: { type: integer, minimum: 0, maximum: 2 }
    AIReviewAgreement:
      type: object
      required: [agent, items_double_rated, kappa, disagreements]
      properties:
        agent: { type: string }
        items_double_rated: { type: integer }
        kappa:
          type: object
          description: Quadratic-weighted Cohen's kappa per axis (null below 2 double-rated items)
          properties:
            grounding: { type: [number, 'null'] }
            tone: { type: [number, 'null'] }
            usefulness: { type: [number, 'null'] }
        disagreements: { type: array, items: { type: string }, description: Item IDs whose two scores differ by 2 on any axis }
    TutorExplainRequest:
      type: object
      required: [question_id, variant_id, chosen_option_id]
      properties:
        question_id: { type: string }
        variant_id: { type: string }
        chosen_option_id: { type: string }
        locale: { type: string, enum: [en, hi, hinglish] }
        confidence: { type: integer, enum: [50, 75, 100], description: The learner's confidence tap before answering (calibration note) }
    TutorExplanation:
      type: object
      required: [explanation_id, reviewed_text, rule_ids, source]
      properties:
        explanation_id: { type: string, description: The approved explanation, or UNKNOWN when none is approved yet (no model call) }
        reviewed_text: { type: string }
        glue_text: { type: [string, 'null'], description: AI glue linking the user's choice to the reviewed text; no digits }
        rule_ids: { type: array, items: { type: string } }
        source: { type: string, enum: [reviewed_bank, template] }
        calibration_note: { type: string, enum: [none, sure_and_wrong, unsure_and_right], description: Computed in code from the confidence tap }
        provenance: { $ref: '#/components/schemas/Provenance' }
    ScreenDecode:
      type: object
      required: [catalogue_id, confidence, confirm_required]
      properties:
        catalogue_id: { type: string, description: Error-catalogue ID or UNKNOWN }
        confidence: { type: number, minimum: 0, maximum: 1 }
        doc_kind: { type: string, enum: [sarathi_status, result_slip, ll, error_page, payment, other] }
        stage: { type: string }
        classes:
          type: array
          items:
            type: object
            properties:
              class_code: { $ref: '#/components/schemas/VehicleClassCode' }
              result: { type: string, enum: [PASS, FAIL, ABSENT, UNKNOWN] }
        remark_raw: { type: string }
        meaning_key: { type: string }
        next_steps:
          type: array
          items:
            type: object
            properties:
              step_key: { type: string }
              due_on: { type: string, format: date }
              rule_id: { type: string }
        confirm_required: { type: boolean, const: true }
    ScamCheckRequest:
      type: object
      properties:
        text: { type: string, maxLength: 4000 }
        url: { type: string, maxLength: 2048 }
        sender: { type: string, maxLength: 64 }
    ScamVerdict:
      type: object
      required: [verdict, red_flags, explanation_source, rules_version]
      properties:
        verdict: { type: string, enum: [likely_scam, cannot_verify], description: Never "safe" or "official" (D-19) }
        red_flags:
          type: array
          items: { type: string, enum: [apk_link, non_allowlisted_domain, lookalike_domain, upi_collect_request, fee_mismatch, urgency, no_test_promise, otp_request, impersonation, setting_offer] }
        domain_checks:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              allowlisted: { type: boolean }
        explanation_source: { type: string, enum: [ai, template] }
        explanation: { type: string }
        guidance_key: { type: string }
        rules_version: { type: string }

    LetterCreate:
      type: object
      required: [kind, language]
      properties:
        kind: { type: string, enum: [escalation, rti_s6_test_record, cpgrams_steps] }
        language: { type: string, enum: [en, hi] }
        recipient_office_id: { type: string }
    Letter:
      type: object
      description: E-28
      required: [letter_id, case_id, kind, status, body]
      properties:
        letter_id: { type: string }
        case_id: { type: string }
        kind: { type: string }
        status: { type: string, enum: [draft, approved_by_user, sent_by_user, discarded] }
        body: { type: string }
        facts_used: { type: object, additionalProperties: true }
        pdf_url: { type: string, format: uri }
        rti_fee_note_key: { type: string }
        we_never_file_key: { type: string, default: letter.user_sends_we_never_file }
    PracticeLog:
      type: object
      description: E-27
      required: [practice_log_id, date, minutes, kind]
      properties:
        practice_log_id: { type: string }
        date: { type: string, format: date }
        minutes: { type: integer, minimum: 1, maximum: 600 }
        kind: { type: string, enum: [supervised_drive, school_lesson, in_app_session] }
        conditions: { type: array, items: { type: string, enum: [day, night, rain, highway, hill, urban] } }
        supervisor: { type: object, properties: { kind: { type: string, enum: [parent, school, other] }, display_name: { type: string } } }
        sign_off: { type: object, properties: { status: { type: string, enum: [none, signed, rejected] }, by: { type: string }, at: { type: string, format: date-time } } }
    PracticeRecord:
      type: object
      required: [record_id, generated_at, sessions, disclaimer_key, check_token]
      properties:
        record_id: { type: string }
        generated_at: { type: string, format: date-time }
        practice_hours: { type: number }
        nazar_score: { type: [integer, 'null'] }
        modules_done: { type: array, items: { type: string } }
        sessions: { type: integer }
        logs: { type: array, items: { $ref: '#/components/schemas/PracticeLog' } }
        signature: { type: string, description: Ed25519 over the canonical JSON (in-app facts only) }
        check_token: { type: string }
        check_url: { type: string, format: uri }
        disclaimer_key: { type: string, default: record.in_app_facts_only_not_a_licence }
    PracticeRecordCheck:
      type: object
      description: Result of the QR check. Wording is "matches what Margdarshak counted", never "verified".
      required: [matches, generated_at, summary]
      properties:
        matches: { type: boolean }
        generated_at: { type: string, format: date-time }
        summary: { type: object, additionalProperties: true }
        disclaimer_key: { type: string }

    School:
      type: object
      description: E-25
      required: [school_id, name, district, accreditation]
      properties:
        school_id: { type: string }
        name: { type: string }
        district: { type: string }
        accreditation: { type: string, enum: [adtc_accredited, licensed_school, unknown] }
        classes: { type: array, items: { $ref: '#/components/schemas/VehicleClassCode' } }
        offers_test_vehicle: { type: boolean }
        pro: { type: boolean }
        sponsored: { type: boolean }
        sample_data: { type: boolean }
    SchoolPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/School' } }
        next_cursor: { type: [string, 'null'] }
    BookingCreate:
      type: object
      required: [kind, consent_id]
      properties:
        kind: { type: string, enum: [lesson, test_vehicle, remedial_training, hazard_training] }
        class_code: { $ref: '#/components/schemas/VehicleClassCode' }
        preferred_date: { type: string, format: date }
        consent_id: { type: string }
        case_id: { type: string }
    Booking:
      type: object
      description: E-26
      required: [booking_id, school_id, kind, status]
      properties:
        booking_id: { type: string }
        school_id: { type: string }
        kind: { type: string }
        status: { type: string, enum: [requested, accepted, declined, rerouted, cancelled, completed] }
        price_shown_paise: { type: [integer, 'null'], description: 'Total including vehicle rental, shown by the school before confirmation' }
    SchoolLearnerPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              learner_code: { type: string }
              stage: { $ref: '#/components/schemas/StageCode' }
              readiness: { type: integer }
              nazar_score: { type: [integer, 'null'] }
              last_active_on: { type: string, format: date }
        next_cursor: { type: [string, 'null'] }
    ConsoleStallReport:
      type: object
      required: [state, from, to, k_threshold, rows]
      properties:
        state: { $ref: '#/components/schemas/StateCode' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        k_threshold: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              office_id: { type: string }
              stage: { $ref: '#/components/schemas/StageCode' }
              cases: { type: integer }
              median_days_in_stage: { type: number }
              p90_days_in_stage: { type: number }
              suppressed: { type: boolean }
    ConsoleAggregate:
      type: object
      required: [metric, rows]
      properties:
        metric: { type: string }
        k_threshold: { type: integer }
        rows: { type: array, items: { type: object, additionalProperties: true } }

    RuleRow:
      type: object
      description: E-08 Rule
      required: [rule_id, kind, value, provenance]
      properties:
        rule_id: { type: string, pattern: '^[A-Z0-9]{2,6}-[A-Z0-9-]+$', description: 'Rule ID from the pack, e.g. ELIG-MC50-16, FEE-LL-ISSUE, TL-LL-MIN-WAIT, BLK-DOB-YEAR-ONLY' }
        kind: { type: string, enum: [eligibility, fee, timeline, document, test_format, blocker, office, content] }
        applies_to: { type: object, additionalProperties: true }
        value: {}
        text_en: { type: string }
        text_hi: { type: string }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        overrides: { type: [string, 'null'], description: rule_id in the base pack this row overrides }
        provenance: { $ref: '#/components/schemas/Provenance' }
    RulePackDraftCreate:
      type: object
      required: [pack_id, base_version, rules]
      properties:
        pack_id: { type: string }
        base_version: { type: string }
        changelog: { type: string, maxLength: 2000 }
        rules: { type: array, items: { $ref: '#/components/schemas/RuleRow' } }
    RulePackVersion:
      type: object
      description: E-08 RulePack
      required: [pack_id, tenant, version, status]
      properties:
        pack_id: { type: string }
        tenant: { $ref: '#/components/schemas/StateCode' }
        version: { type: string }
        base_version: { type: string }
        status: { type: string, enum: [draft, submitted, approved, published, rejected, retired] }
        maker: { type: string }
        checker: { type: [string, 'null'] }
        content_sha256: { type: string }
        signature: { type: string }
        effective_from: { type: string, format: date }
        affected_cases_estimate: { type: integer }
        rules: { type: array, items: { $ref: '#/components/schemas/RuleRow' } }
    ClipStatus:
      type: string
      description: clip-pipeline CLIP_STATUSES (NAZAR §3.2). raw -> transcoded -> blurred (re-blur loops) -> audited (optional) -> proposed -> adjudication (optional) -> rated -> published -> retired; any status may move to retired.
      enum: [raw, transcoded, blurred, audited, proposed, rated, adjudication, published, retired]
    ClipRegister:
      type: object
      required: [raw_object_key, state, filmed_by, city, road_type, time_of_day, weather, pov, captured_month, speed_source, licence, contributor_consent_id]
      additionalProperties: false
      properties:
        raw_object_key: { type: string, maxLength: 256 }
        state: { $ref: '#/components/schemas/StateCode' }
        tenant_tags: { type: array, maxItems: 8, items: { type: string, pattern: '^[A-Z]{2,3}$' }, description: 'Extra tenant tags; state is always the first' }
        filmed_by: { type: string, enum: [passenger, fixed_mount], description: Never the rider }
        city: { type: string, pattern: '^[\p{L}][\p{L} .''-]{1,59}$', description: 'Coarse place, letters only (no street, pin code or coordinates; NAZAR §4)' }
        road_type: { type: string, enum: [urban_arterial, market_street, residential_lane, school_zone, highway, hill_road, rural_road] }
        time_of_day: { type: string, enum: [dawn, day, dusk, night] }
        weather: { type: string, enum: [clear, overcast, haze, rain, fog] }
        pov: { type: string, enum: ['2W', '4W'] }
        captured_month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: Month of capture only (never a date) }
        speed_kmh_est: { type: [number, 'null'], minimum: 0, maximum: 150, description: 'Needed to turn late seconds into metres; null exactly when speed_source is not_logged (such a clip cannot be published)' }
        speed_source: { type: string, enum: [rider_log, speedometer, passenger_estimate, not_logged] }
        licence: { type: string, const: CC-BY-4.0 }
        contributor_consent_id: { type: string }
        duration_ms: { type: integer, minimum: 1000, maximum: 120000, description: 'Length of the raw upload in ms. clip.json needs it from status raw, and no ingest step reports it yet, so the server answers 422 without it.' }
    Clip:
      type: object
      description: |
        E-20 admin view (API-55): clip.json (clip-pipeline ClipSchema) in snake_case plus pipeline state. Blindness
        (NAZAR §6.2): until both ratings of the version exist, a rater sees only `my_rating`, no proposals and no agreement;
        `ratings_visible` and `proposals_visible` say what this caller may see. Fields the caller may not see are omitted.
      required: [clip_id, version, item_ref, status, rating_count, ratings_visible, proposals_visible]
      properties:
        clip_id: { type: string, pattern: '^[A-Z]{2,4}-\d{4,6}$' }
        version: { type: integer, minimum: 1 }
        item_ref: { $ref: '#/components/schemas/ItemRef' }
        status: { $ref: '#/components/schemas/ClipStatus' }
        origin: { type: string, enum: [filmed, ai_generated], default: filmed, description: 'ADR-0013: filmed footage (NAZAR §4) or an AI-generated scene (SynthID-watermarked, labelled AI-generated on every surface)' }
        scene_id: { type: string, pattern: '^SCN-\d{3}$', description: AI clips - the content/nazar/scenes.json scene }
        batch_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$', description: AI clips - the generation batch }
        synthetic_review: { $ref: '#/components/schemas/ClipSyntheticReview' }
        onset_hint:
          type: object
          description: 'AI clips: where the scene puts the cue, for the raters'' first look (about this time, plus or minus tolerance_ms). Never authoritative (two raters set every window), never in clip.json, never sent to learners.'
          required: [approx_onset_ms, tolerance_ms, authoritative, basis]
          properties:
            approx_onset_ms: { type: integer, minimum: 0 }
            tolerance_ms: { type: integer, minimum: 0 }
            authoritative: { type: boolean, const: false }
            basis: { type: string, enum: [measured, nominal] }
        tenant_tags: { type: array, items: { type: string, pattern: '^[A-Z]{2,3}$' } }
        city: { type: string }
        road_type: { type: string, enum: [urban_arterial, market_street, residential_lane, school_zone, highway, hill_road, rural_road] }
        time_of_day: { type: string, enum: [dawn, day, dusk, night] }
        weather: { type: string, enum: [clear, overcast, haze, rain, fog] }
        pov: { type: string, enum: ['2W', '4W'] }
        captured_month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        speed_kmh_est: { type: [number, 'null'], minimum: 0, maximum: 150 }
        speed_source: { type: string, enum: [rider_log, speedometer, passenger_estimate, not_logged, scene_spec], description: 'scene_spec for ai_generated clips (the scene catalogue speed)' }
        duration_ms: { type: integer, minimum: 1000 }
        modules: { type: array, items: { type: string, pattern: '^M\d{1,2}$' } }
        licence: { type: string, const: CC-BY-4.0 }
        attribution: { type: string }
        difficulty:
          type: object
          properties:
            curator: { type: [integer, 'null'], minimum: 1, maximum: 5 }
            empirical: { type: [number, 'null'], minimum: 0, maximum: 5, description: Mean points per hazard over verified takers with trust 0.6 or more; shown from 30 takers }
            irt: { type: [number, 'null'] }
            n_takers: { type: integer, minimum: 0 }
        media:
          type: array
          maxItems: 2
          items:
            type: object
            required: [res, bytes, sha256]
            properties:
              res: { type: string, enum: ['360p', '480p'] }
              bytes: { type: integer, minimum: 1 }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        media_url: { type: string, format: uri, description: Short-lived signed URL of the blurred rendition for playback in the curator and rater UI }
        poster_url: { type: string, format: uri }
        flash_check:
          type: [object, 'null']
          description: WCAG 2.3.1 flash check of the published rendition; a failed clip is never mock-eligible
          properties:
            passed: { type: boolean }
        mock_eligible: { type: boolean }
        mock_ineligible_reasons: { type: array, items: { type: string } }
        hazards:
          type: array
          maxItems: 2
          description: Final windows (from status rated on)
          items:
            type: object
            required: [hazard_id, hazard_type, a_ms, b_ms, rater_count, delta_onset_ms, delta_end_ms, adjudicated, occlusion]
            properties:
              hazard_id: { type: string, pattern: '^h[1-9]\d?$' }
              hazard_type: { $ref: '#/components/schemas/HazardType' }
              a_ms: { type: integer, minimum: 0 }
              b_ms: { type: integer, minimum: 0 }
              rater_count: { type: integer, minimum: 2, maximum: 3 }
              delta_onset_ms: { type: integer, minimum: 0 }
              delta_end_ms: { type: integer, minimum: 0 }
              adjudicated: { type: boolean }
              occlusion: { type: boolean }
              cue_text:
                type: [object, 'null']
                description: Written by the curator from the raters' cues; required to publish
                properties:
                  en: { type: string, maxLength: 160 }
                  hi: { type: string, maxLength: 160 }
        quiet_segments:
          type: array
          maxItems: 32
          items:
            type: object
            required: [from_ms, to_ms]
            properties:
              from_ms: { type: integer, minimum: 0 }
              to_ms: { type: integer, minimum: 0 }
        blur_audit:
          type: [object, 'null']
          description: The latest human blur audit (clip-pipeline BlurAuditRecord summary)
          required: [auditor, rendition_sha256, frames_total, frames_checked, misses, audited_at, passed]
          properties:
            auditor: { type: string, pattern: '^[a-z][a-z0-9]*-[a-z0-9]{1,16}$' }
            rendition_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            frames_total: { type: integer, minimum: 1 }
            frames_checked: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            audited_at: { type: string, format: date-time }
            passed: { type: boolean }
        proposals_visible: { type: boolean }
        proposals:
          type: array
          description: AI window proposals (M-06; a stub in P2), a cross-check only and never a final window (D-09)
          items:
            type: object
            required: [hazard_type, a_ms, b_ms]
            properties:
              hazard_type: { $ref: '#/components/schemas/HazardType' }
              a_ms: { type: integer, minimum: 0 }
              b_ms: { type: integer, minimum: 0 }
              why: { type: string, maxLength: 240 }
        ratings_visible: { type: boolean }
        rating_count: { type: integer, minimum: 0, maximum: 3 }
        my_rating: { $ref: '#/components/schemas/ClipRating' }
        ratings: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/ClipRating' } }
        agreement: { $ref: '#/components/schemas/ClipAgreement' }
        adjudication:
          type: [object, 'null']
          properties:
            adjudicator: { type: string, pattern: '^[a-z][a-z0-9]*-[a-z0-9]{1,16}$' }
            decided_at: { type: string, format: date-time }
            reason_code: { type: string, enum: [type_resolved, window_resolved, presence_resolved, proposal_checked, too_many_hazards, other] }
            resolved: { type: boolean }
            dropped: { type: array, items: { type: string } }
            issues: { type: array, items: { type: string } }
        review_tasks: { type: array, items: { $ref: '#/components/schemas/ClipReviewTask' } }
        workflow_runs: { type: array, items: { $ref: '#/components/schemas/JobRun' } }
        raw_deleted_at: { type: [string, 'null'], format: date-time, description: When the raw upload and intermediates were deleted (at most 24 h after a passing audit and 7 days after upload; MD-218) }
    ClipAgreement:
      type: object
      description: clip-pipeline computeAgreement result (NAZAR §6.3-6.4), computed by the compute service's /clip/agreement and returned in snake_case. Defaults Δonset ≤ 500 ms, Δend ≤ 1000 ms, IoU ≥ 0.3, at most 2 hazards (DATA_PIPELINE §2.3).
      required: [clip_id, version, raters, accepted, needs_third_rater, reasons, metrics, clusters, final_hazards]
      properties:
        clip_id: { type: string, pattern: '^[A-Z]{2,4}-\d{4,6}$' }
        version: { type: integer, minimum: 1 }
        raters: { type: array, minItems: 2, maxItems: 2, items: { type: string } }
        accepted: { type: boolean }
        needs_third_rater: { type: boolean }
        reasons: { type: array, items: { $ref: '#/components/schemas/AgreementReason' } }
        metrics:
          type: object
          required: [matched, median_delta_onset_ms, median_delta_end_ms, mean_iou, kappa_per_second]
          properties:
            matched: { type: integer, minimum: 0 }
            median_delta_onset_ms: { type: [number, 'null'] }
            median_delta_end_ms: { type: [number, 'null'] }
            mean_iou: { type: [number, 'null'] }
            kappa_per_second: { type: [number, 'null'], description: Cohen's kappa on hazard presence per 1 s bin }
        pairs:
          type: array
          items:
            type: object
            required: [cluster_id, a, b, iou, delta_onset_ms, delta_end_ms, same_type, accepted, reasons]
            properties:
              cluster_id: { type: string, pattern: '^c\d+$' }
              a: { $ref: '#/components/schemas/ClipMark' }
              b: { $ref: '#/components/schemas/ClipMark' }
              iou: { type: number, minimum: 0, maximum: 1 }
              delta_onset_ms: { type: number, minimum: 0 }
              delta_end_ms: { type: number, minimum: 0 }
              signed_onset_ms: { type: number, description: Rater A's onset minus rater B's }
              same_type: { type: boolean }
              accepted: { type: boolean }
              reasons: { type: array, items: { $ref: '#/components/schemas/AgreementReason' } }
        only_a: { type: array, items: { $ref: '#/components/schemas/ClipMark' } }
        only_b: { type: array, items: { $ref: '#/components/schemas/ClipMark' } }
        unconfirmed_proposals:
          type: array
          items:
            type: object
            properties:
              hazard_type: { $ref: '#/components/schemas/HazardType' }
              a_ms: { type: integer, minimum: 0 }
              b_ms: { type: integer, minimum: 0 }
              why: { type: string }
        clusters:
          type: array
          description: Candidate hazards in timeline order (c1, c2 ...); the adjudication rules on these
          items:
            type: object
            required: [cluster_id, kind, marks]
            properties:
              cluster_id: { type: string, pattern: '^c\d+$' }
              kind: { type: string, enum: [pair, only_a, only_b, proposal_only] }
              marks:
                type: array
                items:
                  type: object
                  required: [rater, mark]
                  properties:
                    rater: { type: string }
                    mark: { $ref: '#/components/schemas/ClipMark' }
        final_hazards:
          type: array
          description: Final windows when accepted (mean of the two raters, snapped to 30 fps frames); empty otherwise
          items:
            type: object
            required: [hazard_id, hazard_type, a_ms, b_ms, rater_count, delta_onset_ms, delta_end_ms, adjudicated, occlusion]
            properties:
              hazard_id: { type: string }
              hazard_type: { $ref: '#/components/schemas/HazardType' }
              a_ms: { type: integer, minimum: 0 }
              b_ms: { type: integer, minimum: 0 }
              rater_count: { type: integer, minimum: 2, maximum: 3 }
              delta_onset_ms: { type: number, minimum: 0 }
              delta_end_ms: { type: number, minimum: 0 }
              adjudicated: { type: boolean }
              occlusion: { type: boolean }
              cues: { type: array, items: { type: string } }
        options:
          type: object
          properties:
            onset_tolerance_ms: { type: integer }
            end_tolerance_ms: { type: integer }
            min_iou: { type: number }
            max_hazards: { type: integer }
            fps: { type: integer }
            snap_to_frame: { type: boolean }
        computed_at: { type: string, format: date-time }
    AgreementReason:
      type: string
      description: clip-pipeline AgreementReason
      enum: [unmatched_hazard, type_mismatch, onset_delta, end_delta, too_many_hazards, unconfirmed_proposal]
    ClipAdminPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Clip' } }
        next_cursor: { type: [string, 'null'] }
    ClipMark:
      type: object
      description: One rater mark (clip-pipeline RaterMarkSchema, snake_case). a is the onset and b the end (NAZAR §6.1); a < b.
      required: [hazard_type, a_ms, b_ms]
      additionalProperties: false
      properties:
        hazard_type: { $ref: '#/components/schemas/HazardType' }
        a_ms: { type: integer, minimum: 0 }
        b_ms: { type: integer, minimum: 1 }
        cue: { type: string, maxLength: 160, description: 'One-line cue for the curator who writes cue_text, e.g. feet at the bus front; no names or places' }
        occlusion: { type: boolean }
    ClipRatingCreate:
      type: object
      description: One blind rater submission (clip-pipeline RaterSubmissionSchema; E-21). The rater pseudonym comes from the session (admin:clips.rater), never from the body, and submitted_at is server time. The blur audit is its own operation.
      required: [version, decision, marks]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, description: The clip version being rated (must be the current one) }
        review_task_id: { type: string, pattern: '^rvt_[0-9A-Z]{6,26}$', description: The W08 review task this rating answers }
        decision: { type: string, enum: [windows_set, reject], description: 'windows_set (marks may be empty for a quiet clip) or reject (unusable clip; marks must be empty); relayed to n8n W08' }
        marks: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ClipMark' }, description: More than 2 hazards fails agreement (too_many_hazards) and goes to adjudication }
    ClipRating:
      type: object
      description: E-21 stored rating (rater pseudonym, marks, submitted_at; NAZAR §6.4), kept so agreement is reproducible
      required: [rating_id, clip_id, version, rater, decision, marks, submitted_at]
      properties:
        rating_id: { type: string, pattern: '^rtg_[0-9A-Z]{6,26}$' }
        clip_id: { type: string, pattern: '^[A-Z]{2,4}-\d{4,6}$' }
        version: { type: integer, minimum: 1 }
        rater: { type: string, pattern: '^[a-z][a-z0-9]*-[a-z0-9]{1,16}$', description: Pseudonym (e.g. rater-07); never a name }
        decision: { type: string, enum: [windows_set, reject] }
        marks: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ClipMark' } }
        submitted_at: { type: string, format: date-time }
    ClipCueTextsSet:
      type: object
      additionalProperties: false
      required: [version, cues]
      properties:
        version: { type: integer, minimum: 1 }
        cues:
          type: object
          description: Final hazard ID -> the bilingual cue
          maxProperties: 2
          additionalProperties:
            type: object
            additionalProperties: false
            required: [en, hi]
            properties:
              en: { type: string, minLength: 1, maxLength: 160 }
              hi: { type: string, minLength: 1, maxLength: 160 }
        difficulty_curator: { type: integer, minimum: 1, maximum: 5, description: 'The curator difficulty (rubric 1-5) publish requires; no other operation sets it' }
    ClipSyntheticChecks:
      type: object
      description: The five synthetic-content checks of an AI clip (clip-pipeline SyntheticReviewSchema; ai/prompts/clip_generator.md guardrails)
      required: [no_real_likeness, no_readable_plates, no_real_brands, no_collision_or_injury, hazard_visible]
      additionalProperties: false
      properties:
        no_real_likeness: { type: boolean, description: No recognisable real person or celebrity }
        no_readable_plates: { type: boolean, description: Every number plate blank or unreadable at every moment }
        no_real_brands: { type: boolean, description: 'No real brand, logo or readable signboard' }
        no_collision_or_injury: { type: boolean, description: 'No collision, contact, fall or injury at any moment' }
        hazard_visible: { type: boolean, description: The hazard of the scene and its early cue are visible }
    ClipSyntheticReview:
      type: [object, 'null']
      description: 'AI clips only: the latest curator synthetic review, which replaces the blur audit (ADR-0013). Publishing needs passed: true (every check true).'
      required: [reviewer, reviewed_at, checks, passed]
      properties:
        reviewer: { type: string, pattern: '^[a-z][a-z0-9]*-[a-z0-9]{1,16}$' }
        reviewed_at: { type: string, format: date-time }
        checks: { $ref: '#/components/schemas/ClipSyntheticChecks' }
        passed: { type: boolean }
        note: { type: string, maxLength: 240 }
    ClipSyntheticReviewCreate:
      type: object
      description: The curator synthetic review of an AI clip; reviewer (the admin pseudonym) and reviewed_at (server time) come from the server
      required: [version, checks]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        checks: { $ref: '#/components/schemas/ClipSyntheticChecks' }
        note: { type: string, maxLength: 240, description: 'No names, numbers or exact places' }
    ClipGenerate:
      type: object
      description: Start the clip_generate workflow for one scene of content/nazar/scenes.json (one clip per scene revision and batch)
      required: [sceneId, version, batchId]
      additionalProperties: false
      properties:
        sceneId: { type: string, pattern: '^SCN-\d{3}$' }
        version: { type: integer, minimum: 1, description: The scene revision in content/nazar/scenes.json (a mismatch is refused) }
        batchId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
    ClipGenerateAccepted:
      type: object
      description: 'An accepted generation: the clip_generate run. The clip itself is created later by the task (step clip.register_generated); `clip` is present once it exists (a repeat after registration).'
      required: [scene_id, version, batch_id, origin, workflow_run]
      properties:
        scene_id: { type: string, pattern: '^SCN-\d{3}$' }
        version: { type: integer, minimum: 1 }
        batch_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        origin: { type: string, const: ai_generated }
        generation_key: { type: string, description: 'sceneId:version:batchId (one clip per key)' }
        workflow_run: { $ref: '#/components/schemas/JobRun' }
        clip: { $ref: '#/components/schemas/Clip' }
    ClipBlurAuditCreate:
      type: object
      description: The human blur audit (clip-pipeline BlurAuditRecord without the server-known clip, auditor and time)
      required: [version, rendition_sha256, frames_total, frames_checked, misses, miss_frames]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        rendition_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: sha256 of the exact rendition audited; a re-blur produces new bytes and needs a new audit }
        frames_total: { type: integer, minimum: 1, description: 'floor(duration_ms x 30 / 1000), e.g. 1350 for 45 s' }
        frames_checked: { type: integer, minimum: 0 }
        misses: { type: integer, minimum: 0 }
        miss_frames:
          type: array
          maxItems: 500
          items:
            type: object
            required: [frame, kind]
            additionalProperties: false
            properties:
              frame: { type: integer, minimum: 0 }
              kind: { type: string, enum: [face, plate, other_pii] }
              note: { type: string, maxLength: 120, description: No names; describe what is visible }
    ClipAdjudicationCreate:
      type: object
      description: Third-rater adjudication (clip-pipeline AdjudicationInputSchema without the server-known adjudicator and time)
      required: [version, reason_code, decisions]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        reason_code: { type: string, enum: [type_resolved, window_resolved, presence_resolved, proposal_checked, too_many_hazards, other] }
        decisions:
          type: array
          maxItems: 20
          items:
            type: object
            required: [cluster_id, verdict]
            additionalProperties: false
            properties:
              cluster_id: { type: string, pattern: '^c\d+$' }
              verdict: { type: string, enum: [hazard, not_hazard] }
              mark: { $ref: '#/components/schemas/ClipMark' }
    ClipReviewTaskCreate:
      type: object
      description: n8n W08 body (internal). Field names are the ones W08 already sends.
      required: [stage, resume_url, n8n_execution_id]
      additionalProperties: false
      properties:
        stage: { type: string, enum: [rater_1, rater_2] }
        resume_url: { type: string, format: uri, maxLength: 512, description: The W08 Wait node's resume URL; stored encrypted }
        n8n_execution_id: { type: string, maxLength: 64 }
        due_in_hours: { type: integer, minimum: 1, maximum: 168, default: 48 }
        exclude_rater_id: { type: string, pattern: '^[a-z][a-z0-9]*-[a-z0-9]{1,16}$', description: The first rater (rater_2 only) }
        blind_to_rater_1: { type: boolean, default: true, description: Always treated as true (NAZAR §6.2) }
    ClipReviewTask:
      type: object
      required: [review_task_id, clip_id, version, stage, status, due_at]
      properties:
        review_task_id: { type: string, pattern: '^rvt_[0-9A-Z]{6,26}$' }
        clip_id: { type: string, pattern: '^[A-Z]{2,4}-\d{4,6}$' }
        version: { type: integer, minimum: 1 }
        stage: { type: string, enum: [rater_1, rater_2] }
        status: { type: string, enum: [open, submitted, rejected, timed_out, cancelled] }
        assignee: { type: [string, 'null'], description: Rater pseudonym; null while unassigned }
        due_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ClipReviewOutcome:
      type: object
      description: n8n W08 body (internal) when a rater rejects the clip or a wait times out
      required: [status, stage, n8n_execution_id]
      additionalProperties: false
      properties:
        status: { type: string, enum: [rejected, review_timeout] }
        stage: { type: string, enum: [rater_1, rater_2, unknown] }
        n8n_execution_id: { type: string, maxLength: 64 }

    Applicant:
      type: object
      description: E-01 (pseudonymous)
      required: [subject, scope, user_band]
      properties:
        subject: { type: string }
        scope: { type: string }
        user_band: { $ref: '#/components/schemas/UserBand' }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        language: { type: string, enum: [en, hi, doi] }
        a11y: { type: object, additionalProperties: { type: boolean } }
        quiet_hours: { type: object, properties: { start: { type: string }, end: { type: string } } }
        flags: { type: array, items: { type: string, enum: [minor, helper, field_study, deletion_pending] } }
        tenant: { $ref: '#/components/schemas/StateCode' }
    ApplicantPatch:
      type: object
      properties:
        language: { type: string, enum: [en, hi, doi] }
        a11y: { type: object, additionalProperties: { type: boolean } }
        quiet_hours: { type: object, properties: { start: { type: string }, end: { type: string } } }
        dob: { type: string, format: date, writeOnly: true }
        dob_precision: { type: string, enum: [day, year_only] }
    ConsentPurpose:
      type: string
      enum: [ai_coach, ai_voice, whatsapp_updates, email_updates, web_push, analytics, field_study, helper_link, digilocker_pull, aadhaar_offline_check, school_share, parent_card, clip_contribution, parental_consent]
    ConsentChangeInline:
      type: object
      required: [purpose, notice_version, granted]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        notice_version: { type: string }
        granted: { type: boolean }
    ConsentChange:
      type: object
      required: [purpose, action, notice_version]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        action: { type: string, enum: [grant, revoke] }
        notice_version: { type: string }
        language: { type: string }
        recipient: { type: string, description: e.g. school_id or helper_link_id }
    ConsentArtefact:
      type: object
      description: E-15 DEPA-style purpose-bound artefact
      required: [consent_id, purpose, status, granted_at, notice_version]
      properties:
        consent_id: { type: string }
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        data_categories: { type: array, items: { type: string } }
        recipient: { type: [string, 'null'] }
        status: { type: string, enum: [active, revoked, expired] }
        granted_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        notice_version: { type: string }
        language: { type: string }
        signature: { type: string }
    FamilyMemberCreate:
      type: object
      required: [relation, dob, dob_precision]
      additionalProperties: false
      properties:
        relation: { type: string, enum: [self, child, ward, parent, sibling, spouse, other] }
        label: { type: string, maxLength: 40, description: 'Short display label chosen by the account holder (stored encrypted, C3)' }
        dob: { type: string, format: date, writeOnly: true, description: 'Stored encrypted; only the derived age band is returned' }
        dob_precision: { type: string, enum: [day, year_only] }
    FamilyMember:
      type: object
      description: E-01 family member inside an adult account (family mode)
      required: [member_id, relation, age_band, is_minor, parental_consent, created_at]
      properties:
        member_id: { type: string }
        relation: { type: string, enum: [self, child, ward, parent, sibling, spouse, other] }
        label: { type: [string, 'null'] }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        is_minor: { type: boolean }
        parental_consent:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [not_required, required, granted, revoked] }
            consent_id: { type: [string, 'null'] }
        parental_extras:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ParentalExtra' }
          description: Social features the parent has separately consented to for a minor; always empty for an adult member or without the base consent
        created_at: { type: string, format: date-time }
    FamilyMemberPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FamilyMember' } }
    ParentalExtra:
      type: string
      description: Social features a minor's profile may use only with the parent's separate consent (GAMIFICATION_ENGINE §13; gamification featureAccess parentConsents squads, pairMode, shareCards)
      enum: [squads, share_cards, pair_mode]
    ParentalConsentChange:
      type: object
      required: [action, notice_version]
      additionalProperties: false
      properties:
        action: { type: string, enum: [grant, revoke] }
        notice_version: { type: string, maxLength: 64 }
        language: { type: string, enum: [en, hi, doi] }
        extras:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { $ref: '#/components/schemas/ParentalExtra' }
          description: |
            With grant - the full set of extras after this change (omit to leave them unchanged; [] withdraws all).
            With revoke - omit to revoke the consent and every extra; list extras to revoke only those.
    AnalyticsEvent:
      type: object
      required: [name, at]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[a-z0-9_.]{3,64}$' }
        at: { type: string, format: date-time }
        props:
          type: object
          maxProperties: 12
          additionalProperties: { type: [string, number, boolean] }
    ClockSweepRequest:
      type: object
      required: [sweep_id, as_of]
      properties:
        sweep_id: { type: string }
        as_of: { type: string, format: date-time }
        tenants: { type: array, items: { $ref: '#/components/schemas/StateCode' } }
        shard_count: { type: integer, minimum: 1, maximum: 256, default: 8 }
        dry_run: { type: boolean, default: false }
    JobRun:
      type: object
      required: [job, run_id, runner, status]
      properties:
        job: { type: string, enum: [case_clock_sweep, clock_batch, clip_ingest, clip_finalize, clip_generate, session_debrief, debrief_backfill, nightly_stats, rulepack_reevaluate, user_export, user_delete, replay_pending_sessions, retention_sweep] }
        run_id: { type: string }
        runner: { type: string, enum: [render_workflows, temporal, inline], description: 'JobRunnerPort implementation: Render Workflows (hackathon), Temporal (production), inline (dev/CI)' }
        status: { type: string, enum: [started, running, succeeded, failed, cancelled] }
        idempotent_replay: { type: boolean }
    N8nCallback:
      type: object
      required: [event, at]
      properties:
        event: { type: string, enum: [delivery_receipt, inbound_reply, inbound_opt_out, school_lead_decision, letter_approval, field_form_submitted, request_fallback] }
        at: { type: string, format: date-time }
        notification_id: { type: string }
        status: { type: string, enum: [sent, delivered, read, failed] }
        provider_message_id: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        phone_blind_index: { type: string }
        keyword: { type: string }
        report_id: { type: string }
        decision: { type: string }
        reason_code: { type: string }
        moderator: { type: string }
        booking_id: { type: string }
        letter_id: { type: string }
        workflow: { type: string, description: 'n8n workflow id (W01, W02, ...)' }
        execution_id: { type: [string, 'null'] }
        event_id: { type: [string, 'null'], description: The id of the backend envelope the callback answers }
        receipts:
          type: array
          maxItems: 500
          description: W02 batched receipts (one per message)
          items:
            type: object
            required: [notification_id, status]
            properties:
              notification_id: { type: string }
              idempotency_key: { type: [string, 'null'] }
              channel: { $ref: '#/components/schemas/Channel' }
              provider_message_id: { type: [string, 'null'] }
              status: { type: string, enum: [sent, delivered, read, failed, backend_channel] }
              error_code: { type: [string, 'null'], maxLength: 80 }
              at: { type: string, format: date-time }
        notification_ids:
          type: array
          maxItems: 500
          items: { type: string }
          description: request_fallback - notifications the backend should fall back on (email / web push)
    LabTrialCreate:
      type: object
      required: [participant_code, arm, task_id, started_at, ended_at, completed, consent_id]
      properties:
        participant_code: { type: string, pattern: '^P-\d{3}$' }
        arm: { type: string, enum: [portal_replica, margdarshak] }
        task_id: { type: string, enum: [find_fee_and_documents, start_ll_application, choose_class, nazar_mock] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        errors: { type: integer, minimum: 0 }
        completed: { type: boolean }
        sus_score: { type: number, minimum: 0, maximum: 100 }
        would_pay_agent: { type: boolean }
        consent_id: { type: string }
        screens_visited: { type: integer, minimum: 0, maximum: 500, description: MD-140 trial log }
        back_navigations: { type: integer, minimum: 0, maximum: 500 }
        validation_errors: { type: integer, minimum: 0, maximum: 500 }
        selections: { type: array, maxItems: 50, items: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,48}$' }, description: Choice tokens only (e.g. class:MCWG); no free text }
    LabTrial:
      allOf:
        - $ref: '#/components/schemas/LabTrialCreate'
        - type: object
          required: [trial_id]
          properties:
            trial_id: { type: string }
    IntelPrecheck:
      type: object
      required: [report_id, risk, auto_publish_allowed]
      properties:
        report_id: { type: string }
        risk: { type: string, enum: [low, medium, high] }
        corroborating_24h: { type: integer }
        auto_publish_allowed: { type: boolean }
        flags: { type: array, items: { type: string, enum: [pii_pattern, duplicate, new_account, burst, scam_offer] } }
    OutboundMessage:
      type: object
      description: What n8n should send; content comes from approved templates only
      required: [notification_id, channel, template_id, to]
      properties:
        notification_id: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        template_id: { type: string }
        to: { type: string, description: 'Phone (E.164) or email, only for users who opted in to that channel; n8n execution-data retention is set to minimal' }
        vars: { type: object, additionalProperties: { type: [string, number] }, description: 'Template variables; first name only when the user opted in; no other PII' }
        idempotency_key: { type: string, description: '{timelineEventKey}:{channel}' }
    Tenant:
      type: object
      description: E-31 public tenant config (theme, languages, adapter modes, feature flags)
      required: [tenant, display_name_key, languages, adapters, features, rule_pack]
      properties:
        tenant: { $ref: '#/components/schemas/StateCode' }
        display_name_key: { type: string }
        languages: { type: array, items: { type: string, enum: [en, hi, doi, ks, ur, ml, pa] } }
        theme:
          type: object
          description: UX4G-based design tokens; no State Emblem in independent mode
          properties:
            primary: { type: string }
            surface: { type: string }
            logo_url: { type: [string, 'null'], format: uri }
        adapters:
          type: object
          properties:
            sarathi: { type: string, enum: [mock, deeplink, nic] }
            digilocker: { type: string, enum: [mock, negd] }
            aadhaar_offline: { type: string, enum: [disabled, mock, state_service] }
            bhashini: { type: string, enum: [mock, dhruva, local_indictrans2] }
            payment: { type: string, enum: [mock, sarathi_redirect, state_gateway] }
            notification: { type: string, enum: [console, n8n, mgov_sms] }
            slot: { type: string, enum: [mock, crowd, nic] }
        features: { type: object, additionalProperties: { type: boolean } }
        rule_pack: { $ref: '#/components/schemas/RulePackRef' }
        hosting_mode: { type: string, enum: [independent, government_hosted] }
        disclaimer_key: { type: string }
        grievance_officer: { type: object, properties: { name: { type: string }, email: { type: string, format: email } } }
    Notification:
      type: object
      description: E-13 (exposed to the owner only in the privacy export)
      required: [notification_id, channel, template_id, status]
      properties:
        notification_id: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        template_id: { type: string }
        status: { type: string, enum: [queued, sent, delivered, read, failed, suppressed_quiet_hours, suppressed_opt_out, suppressed_daily_cap] }
        timeline_event_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Contact:
      type: object
      description: E-14 (write-only in the API; stored encrypted, separate from the case)
      properties:
        kind: { type: string, enum: [phone, email] }
        value: { type: string, writeOnly: true }
        verified: { type: boolean }
    GameEvent:
      type: object
      description: E-17 Game SDK event envelope (GAME_SDK §5; packages/game-core/schema/GameEvent.json, a oneOf over `type` with one payload schema per type). Events travel only inside ReplayPackage.inputs (bounded, no PII); this component documents the envelope.
      required: [sid, seq, t, type, p]
      properties:
        sid: { type: string, format: uuid }
        seq: { type: integer, minimum: 0, maximum: 4999 }
        t: { type: integer, minimum: 0, maximum: 3600000, description: Session clock (ms since session start) }
        mt: { type: integer, minimum: 0, maximum: 600000, description: Media time (ms) for video games }
        item: { type: integer, minimum: 0, maximum: 39, description: Item index in SessionContext.items }
        type: { type: string, enum: [session_start, item_start, item_end, tap, hazard_response, prediction, estimate, brake, speed_choice, place, lane_pos, mirror_check, scan_look, creep, decision, indicator, input, gear_choice, horn, beam_toggle, camera_check, step_confirm, card_order, answer, confidence, commentary_marker, pause, resume, visibility_hidden, a11y_toggle, session_end] }
        p: { type: object, additionalProperties: true, description: Type-specific payload (see game-core GameEvent.json) }
    TopicMastery:
      type: object
      description: E-18
      required: [topic_id, mastery, coverage]
      properties:
        topic_id: { type: string }
        mastery: { type: number, minimum: 0, maximum: 1 }
        coverage: { type: number, minimum: 0, maximum: 1 }
        brier: { type: [number, 'null'] }
        node_state: { type: string, enum: [locked, learning, mastered, fading] }
    AuditLogEntry:
      type: object
      description: E-30 (append-only; exposed only to admin tooling, not in this public contract's paths)
      required: [audit_id, at, actor, action, target]
      properties:
        audit_id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        actor_scope: { type: string }
        action: { type: string }
        target: { type: string }
        tenant: { $ref: '#/components/schemas/StateCode' }
        ip_trunc: { type: string }
        trace_id: { type: string }
        prev_hash: { type: string }
        hash: { type: string }
    LlFormat:
      type: object
      required: [state, rule_id, known, provenance]
      properties:
        state: { $ref: '#/components/schemas/StateCode' }
        rule_id: { type: string }
        known: { type: boolean, description: false means the default format is used with an "unknown for your state" banner }
        questions: { type: [integer, 'null'] }
        pass_correct: { type: [integer, 'null'] }
        pass_pct: { type: [integer, 'null'] }
        per_question_timer_s: { type: [integer, 'null'] }
        total_timer_s: { type: [integer, 'null'] }
        online_test_available: { type: boolean, description: EC-10 false switches the plan card to "test at RTO" }
        where: { type: array, items: { type: string, enum: [home_online, csc, rto] } }
        languages: { type: array, items: { type: string } }
        provenance: { $ref: '#/components/schemas/Provenance' }
    SignOffRequestCreate:
      type: object
      required: [practice_log_ids, signer_kind]
      properties:
        practice_log_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
        signer_kind: { type: string, enum: [school, supervisor] }
        school_id: { type: string }
        supervisor_contact: { $ref: '#/components/schemas/Contact' }
        consent_id: { type: string }
    SignOffRequest:
      type: object
      required: [signoff_request_id, status, signer_kind]
      properties:
        signoff_request_id: { type: string }
        signer_kind: { type: string, enum: [school, supervisor] }
        status: { type: string, enum: [sent, signed, rejected, expired] }
        expires_at: { type: string, format: date-time }
    KhudLicenceDeclaration:
      type: object
      required: [dl_issued_on, no_agent_used]
      properties:
        case_id: { type: string }
        dl_issued_on: { type: string, format: date }
        no_agent_used: { type: boolean, const: true }
        first_attempt_pass: { type: boolean }
    PublicStats:
      type: object
      required: [as_of]
      properties:
        as_of: { type: string, format: date-time }
        nazar:
          type: object
          additionalProperties: true
          description: S2 Nazar study (FIELD_STUDY §4), as printed by field-kit/nazar_stats.mjs on the exported CSVs and stored by stats.field_study_publish; null-valued until enough data exists
          properties:
            status: { type: string, enum: [collecting, published] }
            sample: { type: string, enum: [convenience] }
            participants: { type: integer, minimum: 0, description: N after the pre-registered exclusions (the script's "N after" line); the live enrolment count is counters.nazar_participants }
            below_kerala_60_pct: { type: [number, 'null'], minimum: 0, maximum: 1, description: H1 - share below 60/100 on the primary score }
            ci95: { type: [array, 'null'], minItems: 2, maxItems: 2, items: { type: number }, description: Wilson 95% CI of below_kerala_60_pct }
            r_ll_quiz_vs_nazar: { type: [number, 'null'], minimum: -1, maximum: 1, description: H2 - Pearson r of LL quiz and Nazar scores }
            r_ci95: { type: [array, 'null'], minItems: 2, maxItems: 2, items: { type: number }, description: Fisher-z 95% CI of r_ll_quiz_vs_nazar }
            median_late_s: { type: [number, 'null'], minimum: 0, description: Median seconds late over clips tapped inside a window }
            prereg_hash: { type: [string, 'null'], description: Commit hash of HYPOTHESES.md (pre-registration) }
            script_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: sha256 of field-kit/nazar_stats.mjs as run }
        journey_test: { type: object, additionalProperties: true }
        counters: { type: object, additionalProperties: { type: integer } }
        disclaimer_key: { type: string }
    StudyEnrolmentCreate:
      type: object
      description: S2 enrolment (FIELD_STUDY §4.3 steps 1-2). Bands only; never a name, phone, licence number, face or location.
      required: [age_ok, age_band, licence_held, years_driving]
      additionalProperties: false
      properties:
        consent_id: { type: string, pattern: '^cns_[0-9A-Z]{6,26}$', description: 'Optional; when sent it must be the active field_study consent of this session (API-60), which the server looks up either way' }
        age_ok: { type: boolean, const: true, description: The consent screen's 18+ box (FIELD_STUDY §6.1) }
        age_band: { type: string, enum: ['18_20', '21_24', '25_34', 35_plus] }
        licence_held: { type: string, enum: [ll, '2w', '4w', both] }
        years_driving: { type: string, enum: ['0_1', '1_3', 3_plus] }
        retake_of: { type: [string, 'null'], pattern: '^P-\d{3,4}$', description: 'Participant code of the same person''s earlier session (test-retest only; excluded from H1-H3)' }
    StudyEnrolment:
      type: object
      required: [participant_code, form, cohort, phases, ai_debrief, created_at]
      properties:
        participant_code: { type: string, pattern: '^P-\d{3,4}$' }
        form: { type: string, enum: [A, B, C], description: 'A: test B1+B2, fresh B3; B: test B2+B3, fresh B1; C: test B1+B3, fresh B2 (FIELD_STUDY §4.2)' }
        cohort: { type: string, const: field_test }
        phases:
          type: array
          description: The flow in order. ll_mock, test and fresh are game sessions (API-34 with `study`); feedback is the replay endpoint on two clips of the test session.
          items:
            type: object
            required: [phase, game_id, item_count]
            properties:
              phase: { type: string, enum: [ll_mock, test, feedback, fresh] }
              game_id: { $ref: '#/components/schemas/GameId' }
              item_count: { type: integer, minimum: 1 }
        ai_debrief: { type: boolean, description: 'False: the study cohort gets template debriefs only (FIELD_STUDY §4.3), unless paid-tier billing is confirmed (DEC-020) and ai_coach is granted' }
        created_at: { type: string, format: date-time }
    StudyNearMissCreate:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 140, description: 'Optional one line: "Has a near-miss ever happened to you? What happened?" Privacy-scanned before storage' }
        language: { type: string, enum: [en, hi] }
    DataExport:
      type: object
      description: 'API-61 export bundle (DPDP access right): every row tied to the account, nothing else. Analytics events are pseudonymous (daily-rotating key) and cannot be linked back, so they are listed as not included.'
      required: [export_id, generated_at, subject, tenant, sections]
      properties:
        export_id: { type: string }
        generated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        subject: { type: string }
        tenant: { $ref: '#/components/schemas/StateCode' }
        format_version: { type: string }
        sections: { type: object, additionalProperties: true }
        not_included: { type: array, items: { type: string } }
    MyLicences:
      type: object
      required: [items, show_dl_holder_view, server_time]
      properties:
        server_time: { type: string, format: date-time }
        show_dl_holder_view: { type: boolean, description: True only when a DL mirror exists (MD-124) }
        items:
          type: array
          items:
            type: object
            required: [case_id, state]
            properties:
              case_id: { type: string }
              state: { $ref: '#/components/schemas/JourneyState' }
              for_family_member: { type: boolean }
              ll: { oneOf: [ { $ref: '#/components/schemas/LearnerLicenceMirror' }, { type: 'null' } ] }
              dl: { oneOf: [ { $ref: '#/components/schemas/DrivingLicenceMirror' }, { type: 'null' } ] }
              ll_valid: { type: boolean }
              days_to_ll_expiry: { type: [integer, 'null'] }
              renewal_window_open: { type: boolean }
              digilocker_pointer: { type: [string, 'null'], description: 'Where an issued DL appears (DigiLocker "Issued documents"); a pointer, never the document' }
              key_dates: { type: object, additionalProperties: { type: [string, 'null'], format: date } }
    AnalyticsDigest:
      type: object
      required: [period, from, to, k_min, publishable, sections, generated_at]
      properties:
        period: { type: string, enum: [day, week] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        k_min: { type: integer, const: 5 }
        publishable: { type: boolean }
        reason: { type: [string, 'null'], enum: [insufficient_sample, null] }
        sql_version: { type: string }
        generated_at: { type: string, format: date-time }
        suppressed_cells: { type: integer, minimum: 0 }
        minor_cases_excluded: { type: boolean, const: true }
        sections:
          type: array
          items:
            type: object
            required: [title, rows]
            properties:
              title: { type: string }
              rows:
                type: array
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label: { type: string }
                    value: { type: [integer, string], description: 'A count, or "suppressed (n < 5)"' }
                    suppressed: { type: boolean }
    DemoPersona:
      type: object
      required: [persona_id, label, ref]
      properties:
        persona_id: { type: string }
        ref: { type: string, description: P-xx persona reference (docs/01-product/PERSONAS.md) }
        label: { type: string }
        description_key: { type: string }
        synthetic: { type: boolean, const: true }
