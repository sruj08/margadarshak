      operationId: registerClip
      summary: Clip admin - register an uploaded raw clip and start the clip_ingest workflow
      description: The server assigns the clip ID (`<CITY>-<NNNN>`, clip-pipeline CLIP_ID_RE) and version 1, stores clip.json in status `raw` and starts `clip_ingest` (transcode, blur, flash check, proposals stub, open review). Metadata is coarse on purpose (NAZAR §4, §13) - city at most, capture month only, no coordinates.
      security:
        - userBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
