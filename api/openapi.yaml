  /v1/games/sessions/{sessionId}/complete:
    post:
      x-api-id: API-35
      tags: [games]
      operationId: completeGameSession
      summary: Submit client result + replay; server replays with game-core and overwrites the score
      description: |
        The API sends the replay, the session's items (with their scoring documents inline) and, for Nazar, a per-clip
        analysis request to the private score verifier (2 s budget). The server result overwrites the client preview
        (D-11); a mismatch adds `INT_REPLAY_MISMATCH`, never an accusation.

        * Idempotent on the session: the same `replay.digest` returns the stored result; a different digest is 409.
        * The replay is at most 512 KB (413 otherwise). Completing after `expires_at` is allowed and flagged `INT_SESSION_EXPIRED`.
        * Verifier unavailable: the session is stored as `pending_verification` and the answer is still 200, with
          `server_checked: false`, `provisional: true` and the client preview; the `replay_pending_sessions` task
          re-checks it and overwrites the result. Nothing counts (Nazar Score, XP, badges, share cards) until then.
        * `client_result.replay.inputs` should be an empty string: the inputs travel once, in `replay.inputs`.
      security:
        - deviceSession: []
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameSessionComplete' }
            example:
