  /v1/games/{gameId}/sessions:
    post:
      x-api-id: API-34
      tags: [games]
      operationId: startGameSession
      summary: Start a game session; server issues seed, items, versions and the game's SessionContext
      description: |
        Available to everyone (D-13 revised, AI for everyone). A learner aged 16-17 plays inside a parent's account
        (family mode, `family_member_id`); a session for a minor family member needs the parent's recorded consent,
        otherwise 403 `PARENT_CONSENT_REQUIRED`, and mode `pair` also needs the parent's `pair_mode` extra.

        * The seed is a uniformly random uint32 (`seed_origin: server`). `ctx` is the game-core SessionContext handed to
          the game module unchanged.
        * Versions and refs come from `content/generated/game-items.json`; Nazar clips come from published clips. A Nazar
          mock gets 10 mock-eligible clips this subject has never seen, spread over curator difficulty 2-4; when there are
          not enough the answer is 409 `NO_UNSEEN_CLIPS`. Mock, pair and study items are recorded as seen at start.
        * Hazard windows are sent only for learn and practice items (`items[].reveal`, which also records the clip as
          seen); never for mock, pair or study sessions.
        * `study` sessions take their items from the participant's form (FIELD_STUDY §4.2) and are stored with cohort
          `field_test`; only the device session that enrolled the participant may start them.
        * A session played offline is registered late with `offline_started_at`, `offline_seed` and `offline_items`
          (`seed_origin: client_offline`, flagged `INT_OFFLINE_SEED`, never Nazar-Score eligible).
        * Practice and familiarisation, not certification (`label_key`).
      security:
        - deviceSession: []
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameSessionCreate' }
            examples:
              mock:
                summary: Adult Nazar mock in the Kerala format
                value: { mode: mock, a11y_modes: [no_audio], device_class: low, locale: hi }
              family_practice:
                summary: Practice for a family member after a debrief drill (parent's consent on record)
                value: { mode: practice, family_member_id: fam_01JB8ZQ, difficulty: null, drill_id: DR-NAZ-OCCL-TRUCK_LEFT_TURN, device_class: mid, locale: en }
              study_test:
                summary: Field-study test block (10 clips of the participant's form)
                value: { mode: mock, study: { participant_code: P-017, phase: test }, device_class: mid, locale: en }
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSessionStart' }
              example:
                session_id: 0192f7a8-6b1c-7d2e-9f30-4a5b6c7d8e9f
                game_id: nazar
                manifest_version: 1.0.0
                scoring_version: '1.0'
                content_version: '2158efb82d8a3f64'
                seed: 734119
                seed_origin: server
                difficulty: 3
                mode: mock
                items:
                  - { item_ref: 'clip:KL-0001@1', kind: clip, content_version: '1', asset_url: 'https://media.margdarshak.example/clips/KL-0001/v1/360p.mp4?sid=0192f7a8&exp=1793606400&sig=4b1e9c', sha256: a86f144894945143f13ae467fdca7234c364d469e4e516482349eb421db7ad8d, bytes: 1840000 }
                  - { item_ref: 'clip:KL-0002@1', kind: clip, content_version: '1', asset_url: 'https://media.margdarshak.example/clips/KL-0002/v1/360p.mp4?sid=0192f7a8&exp=1793606400&sig=77d01a', sha256: b1b0a0eac595da6c7823eb482299a93b366b5fd66a6edfa5a2f7cf0f5aae7883, bytes: 1620000 }
                ctx:
                  sid: 0192f7a8-6b1c-7d2e-9f30-4a5b6c7d8e9f
                  gameId: nazar
                  mode: mock
                  userBand: adult
                  locale: hi
                  a11y: { modes: [no_audio], textScale: 1, haptics: false }
                  difficulty: 3
                  seed: 734119
