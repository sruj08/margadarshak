  /v1/cases/{caseId}/identity/aadhaar-offline:
    post:
      x-api-id: API-18
      x-proposed: true
      tags: [cases]
      operationId: verifyAadhaarOffline
      summary: Verify an Aadhaar Secure QR or Paperless Offline e-KYC XML signature (offline only, never eKYC)
      description: |
        **Mock-only in Margdarshak** (F-56): real Secure QR / Paperless XML verification brings
        OVSE duties, so in government mode the state runs it and the adapter calls the state's
        service. Tenant flag `aadhaar_offline` is `mock` or `state_service`. In the mock the artefact is
        processed in memory, its UIDAI signature is checked against the published UIDAI
        certificate, and only derived booleans are kept: `signature_valid`, `age_band`,
        `address_state_matches`, `dob_precision` and a salted hash of the reference ID.
        The artefact, photo, name and address are discarded. No Aadhaar number is ever read,
        accepted or stored.
      security:
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, artefact, consent_id]
              properties:
                kind: { type: string, enum: [secure_qr, paperless_xml_zip] }
                artefact:
                  type: string
                  contentMediaType: application/octet-stream
                  description: QR payload bytes or the ZIP; max 2 MB
                share_code:
                  type: string
                  description: ZIP share phrase (paperless XML only); used in memory, never stored or logged
                  writeOnly: true
                consent_id: { type: string }
      responses:
        '200':
          description: Verification verdict (derived facts only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AadhaarOfflineVerdict' }
              example: { signature_valid: true, age_band: '18_19', dob_precision: year_only, address_state_matches: false, reference_hash: 'sha256:9f2c...', simulated: true, retained_fields: [signature_valid, age_band, dob_precision, address_state_matches, reference_hash] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

