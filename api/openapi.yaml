          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipAdminPage' }
              example:
                items:
                  - { clip_id: KL-0007, version: 1, item_ref: 'clip:KL-0007@1', status: rated, tenant_tags: [KL], duration_ms: 45000, rating_count: 2, ratings_visible: true, proposals_visible: true, mock_eligible: false }
                  - { clip_id: KL-0008, version: 1, item_ref: 'clip:KL-0008@1', status: adjudication, tenant_tags: [KL], duration_ms: 50000, rating_count: 2, ratings_visible: true, proposals_visible: true, mock_eligible: false }
                next_cursor: null
