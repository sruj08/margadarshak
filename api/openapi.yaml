            example: { raw_object_key: raw/2026-10-24/jmu_bypass_0042.mp4, state: JK, filmed_by: passenger, city: Jammu, road_type: urban_arterial, time_of_day: day, weather: clear, pov: '2W', captured_month: '2026-10', speed_kmh_est: 40, speed_source: rider_log, licence: CC-BY-4.0, contributor_consent_id: cns_01JB8ZP }
      responses:
        '202':
          description: Ingest workflow started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clip' }
              example: { clip_id: JMU-0001, version: 1, item_ref: 'clip:JMU-0001@1', status: raw, tenant_tags: [JK], city: Jammu, rating_count: 0, ratings_visible: false, proposals_visible: false, workflow_runs: [ { job: clip_ingest, run_id: trn-5c1e07, runner: render_workflows, status: started, idempotent_replay: false } ] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/admin/clips/generate:
    post:
      x-api-id: API-55
      x-proposed: true
      tags: [ecosystem]
      operationId: generateClip
      summary: Clip admin - start an AI-generated clip from one scene (ADR-0013; Gemini video via the clip_generate workflow)
      description: |
        admin:clips.curator. Starts the `clip_generate` Render Workflows task with `[{sceneId, version, batchId}]`
        (generate, precheck, register, transcode, render, flash check, open review). The task's `clip.register_generated`
        step creates the clip (`origin: ai_generated`, status `raw`). Idempotent per scene revision and batch (job key
        `sceneId:version:batchId:generate`): a repeat returns the same run and starts nothing. 422 for an unknown scene or a
        version that is not the scene's revision (checked when the catalogue is readable); 503 when no job runner is
        configured.
      security:
        - userBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipGenerate' }
            example: { sceneId: SCN-001, version: 1, batchId: b20261024a }
      responses:
        '202':
          description: Generation started (a repeat returns the same run, and the clip once the task has registered it)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClipGenerateAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/admin/clips/{clipId}:
    get:
      x-api-id: API-55
      tags: [ecosystem]
      operationId: getClipAdmin
      summary: Clip admin - status, signed media, blur audit, proposals, ratings, agreement, review tasks and workflow run IDs
      description: |
        Blindness (NAZAR §6.2): until both ratings of the current version exist, a rater sees only their own rating
        (`my_rating`), no proposals and no agreement; `ratings_visible` and `proposals_visible` say what this caller may
        see. Proposals are a cross-check only and never become a final window (D-09). `media_url` is a short-lived signed
        URL of the blurred rendition for playback in the curator and rater UI.
      security:
        - userBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/ClipId'
      responses:
        '200':
          description: Clip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clip' }
              example:
                clip_id: KL-0007
                version: 1
                item_ref: 'clip:KL-0007@1'
                status: rated
                tenant_tags: [KL]
                city: Kochi
                road_type: urban_arterial
                time_of_day: day
                weather: clear
                pov: '2W'
                captured_month: '2026-10'
                speed_kmh_est: 30
                speed_source: rider_log
                duration_ms: 45000
                modules: [M4]
                licence: CC-BY-4.0
                attribution: 'Margdarshak clip bank, team Chanakya (Nestiq Private Limited), 2026'
                difficulty: { curator: 2, empirical: null, irt: null, n_takers: 0 }
