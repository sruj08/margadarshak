  /v1/study/nazar/enrolments:
    post:
      x-api-id: API-70
      x-proposed: true
      tags: [field-study]
      operationId: enrolNazarStudy
      summary: Enrol in the online Nazar study (S2) after the in-app consent; returns the pseudonymous participant code and the counterbalanced form
      description: |
        FIELD_STUDY §4. Called only after the participant accepts the consent screen (§6.1) and API-60 has stored an active
        `field_study` consent for this session (403 `CONSENT_REQUIRED` otherwise); declining means no call at all and
        nothing stored. 18+ only: `age_ok` must be true. Forms rotate A -> B -> C by arrival order (§4.2). Unlike API-70
        lab trials this is not token-gated, because the study runs online from a QR link. Enrolling again from the same
        session returns the existing participant (200); a retake is a new enrolment with `retake_of`. The study cohort
        gets template debriefs only (no AI call) unless `ai_debrief` says otherwise.
      security:
        - deviceSession: []
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudyEnrolmentCreate' }
            example: { consent_id: cns_01JB8ZT, age_ok: true, age_band: '21_24', licence_held: '2w', years_driving: '1_3', retake_of: null }
      responses:
        '200':
          description: Already enrolled from this session; the existing participant is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyEnrolment' }
        '201':
          description: Enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyEnrolment' }
              example:
                participant_code: P-017
                form: B
                cohort: field_test
                phases:
                  - { phase: ll_mock, game_id: ll_sim, item_count: 15 }
                  - { phase: test, game_id: nazar, item_count: 10 }
                  - { phase: feedback, game_id: nazar, item_count: 2 }
                  - { phase: fresh, game_id: nazar, item_count: 5 }
                ai_debrief: false
                created_at: '2026-11-07T11:00:00Z'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/study/nazar/enrolments/{participantCode}/near-miss:
    post:
      x-api-id: API-70
      x-proposed: true
      tags: [field-study]
      operationId: recordNazarNearMiss
      summary: Optional one-line near-miss story at the end of the study flow (stored only in the study table)
      description: FIELD_STUDY §4.3 step 8. Only the session that enrolled the participant may write it (404 otherwise). The line is privacy-scanned before it is stored; a name, phone number, vehicle registration, licence number or exact place is rejected with 422 `PROHIBITED_FIELD` and nothing is stored. It is never exported to the CSVs and never shown publicly without a separate quote consent. A second call replaces the line.
      security:
        - deviceSession: []
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/ParticipantCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudyNearMissCreate' }
            example: { text: 'Bus ke peeche se ek ladka achanak nikla, maine aakhri second pe brake lagaya', language: hi }
      responses:
        '204': { description: Stored }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

