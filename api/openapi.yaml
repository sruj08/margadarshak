openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Margdarshak Core API
  version: 1.0.0-draft.1
  summary: Citizen front end and open adapter specification for the Indian driving-licence journey.
  description: |
    Contract for the Margdarshak core (FastAPI). Every endpoint carries its API-xx ID from
    `docs/00-overview/PROJECT_BRIEF.md` in `x-api-id`. Endpoints marked `x-proposed: true` are
    additions proposed by the engineering bible (auth, helper links, identity, payment hand-off,
    DigiLocker) and are listed as inconsistencies for the PROJECT_BRIEF owner to ratify.

    Independent prototype by team Chanakya. Not affiliated with MoRTH, NIC or any State
    Transport Department. Uses simulated government data. Margdarshak never collects an Aadhaar
    number, OTP, biometrics or government fees.

    Conventions (see docs/03-engineering/API_SPEC.md):
    * Errors use RFC 9457 `application/problem+json`.
    * Writes accept an `Idempotency-Key` header (UUIDv7 recommended); replays within 24 h return the stored response.
    * Lists use opaque cursor pagination (`cursor`, `limit`, `next_cursor`).
    * Rate limits are announced with `RateLimit-Policy` and `RateLimit` headers; 429 carries `Retry-After`.
    * All timestamps are RFC 3339 in UTC; all dates are ISO 8601 calendar dates in Asia/Kolkata.
    * Money is integer **paise** (`amount_paise`, e.g. 70000 = Rs 700), always computed from the tenant rule pack (`fees.json`, unit paise); no literals.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Team Chanakya (Nestiq Private Limited)
servers:
  - url: https://api.margdarshak.example
    description: Placeholder host. The hackathon host is the Render Singapore URL in README (domain not yet chosen; owner Platform lead, due H+6).
  - url: http://localhost:8000
    description: Local development (docker compose)
tags:
  - name: plan
    description: API-01..05 and API-23 Licence plan, rule look-ups and tenant config (no login)
  - name: auth
    description: API-06..09 and API-58 Device sessions, accounts, helper links (proposed)
  - name: cases
    description: API-10..19 Case lifecycle, autosave, timeline, hand-off
  - name: documents
    description: API-20..22 On-device checks and DigiLocker pull
  - name: offices
    description: API-25..29 Offices, slots, slot watches, RTO Live Intel
  - name: learn
    description: API-30..33 Learn hub, FSRS, readiness
  - name: games
    description: API-34..39 and API-57 Game sessions, server replay, debrief, Nazar clips, achievements, squads, share cards
  - name: ai
    description: API-40..43 Voice guide, tutor, screen decoder, scam checker
  - name: records
    description: API-44..49 Declarations, letters, Practice Record and sign-off requests
  - name: ecosystem
    description: API-50..56 Schools, state console, rule-pack studio, clip admin, moderation
  - name: privacy
    description: API-59..63 Profile, consents, export, deletion, analytics
  - name: platform
    description: API-24, API-64..69, API-72, API-73 Health and internal machine endpoints (internal scope, n8n bearer + HMAC; n8n never queries Postgres directly)
  - name: field-study
    description: API-70..71 Field-study lab, online Nazar study (enrolment, near-miss, CSV export) and public counters

security:
  - deviceSession: []

paths:
  /v1/health:
    get:
      x-api-id: API-64
      tags: [platform]
      operationId: getHealth
      summary: Liveness and dependency readiness
      security: []
      parameters:
        - name: deep
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, checks Postgres, Key Value, score verifier and adapter health (internal callers only; rate limited).
      responses:
        '200':
          description: Healthy or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: degraded
                version: 1.0.0+sha.3f2a9c1
                time: '2026-10-24T03:30:00Z'
                checks:
                  postgres: { status: ok, latency_ms: 4 }
                  key_value: { status: ok, latency_ms: 2 }
                  score_verifier: { status: ok, latency_ms: 11 }
                  gemini: { status: degraded, detail: 'fallback rate 22% over 5 min; template debriefs in use' }
                adapters:
                  sarathi: { implementation: deeplink, status: ok }
                  digilocker: { implementation: mock, status: ok }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/plans:
    post:
      x-api-id: API-01
      tags: [plan]
      operationId: createPlan
      summary: Compute a licence plan in 3 taps (no login, no PII stored)
      description: |
        Pure rules-engine evaluation against the tenant's published rule pack. No AI. The request
        is not persisted beyond a 7-day plan snapshot keyed by `plan_id` (used by API-04 and
        API-10). DOB is reduced to an age band plus key birthdays before storage.
      security:
        - {}
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
            example:
              state: JK
              dob: '2007-03-14'
              dob_precision: day
              vehicles: [motorcycle, car]
              aadhaar_address_matches_residence: true
              already_holds_ll: false
              language: hi
      responses:
        '201':
          description: Plan computed
          headers:
            Location: { $ref: '#/components/headers/Location' }
            RateLimit: { $ref: '#/components/headers/RateLimit' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/plans/{planId}:
    get:
      x-api-id: API-01
      x-proposed: true
      tags: [plan]
      operationId: getPlan
      summary: Read a stored plan snapshot (the link sent by API-04; anonymous, no personal data, 7-day life)
      security:
        - {}
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/plans/{planId}/whatsapp:
    post:
      x-api-id: API-04
      tags: [plan]
      operationId: sendPlanToWhatsApp
      summary: Send the plan card to WhatsApp (opt-in, template message via n8n)
      description: |
        Creates a `whatsapp_updates` consent artefact if none exists, stores the phone number
        encrypted (E-14) and enqueues an approved template message through NotificationPort.
        In the hackathon the Meta test number reaches only allow-listed recipients.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppSendRequest' }
            example:
              phone_e164: '+919876543210'
              consent: { purpose: whatsapp_updates, notice_version: notice-2026.10.23-hi, granted: true }
              language: hi
      responses:
        '202':
          description: Message queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationAccepted' }
              example: { notification_id: ntf_01JB8Z7C, status: queued, channel: whatsapp, template_id: plan_card_v1 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/rules/{state}/classes:
    get:
      x-api-id: API-02
      tags: [plan]
      operationId: listClasses
      summary: Vehicle classes, eligibility rules and content depth for a state
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/State'
        - name: version
          in: query
          required: false
          schema: { type: string }
          description: Rule-pack version; defaults to the latest published.
      responses:
        '200':
          description: Class catalogue
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassCatalogue' }
              example:
                state: JK
                rule_pack: { pack_id: JK, version: 2026.10.0, base_version: IN-base@2026.10.0 }
                classes:
                  - class_code: MC50CC
                    label_key: class.mc50cc
                    min_age_years: 16
                    guardian_consent_required: true
                    medical_form_1a: over_40
                    transport: false
                    content_depth: thin
                    rule_id: ELIG-MC50CC-AGE
                    provenance: { source_title: MV Act 1988 s.4(2); Delhi Transport class page, source_url: https://transport.delhi.gov.in, verified_on: '2026-10-22', confidence: medium, verified: true }
                  - class_code: LMV-TR
                    label_key: class.lmv_tr
                    min_age_years: 20
                    guardian_consent_required: false
                    medical_form_1a: always
                    transport: true
                    content_depth: coming
                    rule_id: ELIG-TRANSPORT-AGE
                    flags: [verify_at_rto, lmv_prerequisite_unverified]
                    provenance: { source_title: MV Act 1988 s.4, source_url: https://www.indiacode.nic.in, verified_on: '2026-10-22', confidence: low, verified: false }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/rules/{state}/fees:
    get:
      x-api-id: API-03
      tags: [plan]
      operationId: getFees
      summary: Fee table for a state (from fees.json in the rule pack)
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/State'
        - name: classes
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/VehicleClassCode' }
          description: When given, the response includes a computed quote for these classes.
      responses:
        '200':
          description: Fee table and optional quote
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeeTable' }
              example:
                state: JK
                rule_pack: { pack_id: JK, version: 2026.10.0, base_version: IN-base@2026.10.0 }
                items:
                  - { fee_id: ll_issue, per: class, amount_paise: 15000, rule_id: FEE-LL-ISSUE }
                  - { fee_id: ll_test, per: attempt, amount_paise: 5000, rule_id: FEE-LL-TEST }
                  - { fee_id: dl_test, per: class_attempt, amount_paise: 30000, rule_id: FEE-DL-TEST }
                  - { fee_id: dl_issue, per: licence, amount_paise: 20000, rule_id: FEE-DL-ISSUE }
                  - { fee_id: smart_card, per: licence, amount_paise: 20000, rule_id: FEE-SMART-CARD }
                quote:
                  quote_id: fq_01JB8Z9
                  currency: INR
                  lines:
                    - { line_id: ll_issue, label_key: fee.ll_issue_per_class, class_code: MCWG, quantity: 1, amount_paise: 15000, rule_id: FEE-LL-ISSUE }
                    - { line_id: ll_test, label_key: fee.ll_test, quantity: 1, amount_paise: 5000, rule_id: FEE-LL-TEST }
                    - { line_id: dl_test, label_key: fee.dl_test_per_class, class_code: MCWG, quantity: 1, amount_paise: 30000, rule_id: FEE-DL-TEST }
                    - { line_id: dl_issue, label_key: fee.dl_issue, quantity: 1, amount_paise: 20000, rule_id: FEE-DL-ISSUE }
                    - { line_id: smart_card, label_key: fee.smart_card, quantity: 1, amount_paise: 20000, rule_id: FEE-SMART-CARD }
                  subtotal_govt_fee_paise: 70000
                  total_paise: 90000
                  excludes: [state_service_charge, postage]
                  provenance: { source_title: CMVR 1989 r.32, source_url: https://himachal.gov.in, verified_on: '2026-10-22', confidence: medium, verified: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/rules/{state}/ll-format:
    get:
      x-api-id: API-05
      tags: [plan]
      operationId: getLlFormat
      summary: LL test format for the state (question count, pass mark, timers, where held, source and date)
      description: Drives the LL Test Simulator (F-22). When the format is unknown the response says so and the simulator uses the documented default with a banner.
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/State'
      responses:
        '200':
          description: LL format
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlFormat' }
              example:
                state: JK
                rule_id: LL-FORMAT
                known: true
                questions: 10
                pass_correct: 6
                pass_pct: 60
                per_question_timer_s: null
                total_timer_s: null
                online_test_available: true
                where: [home_online, csc, rto]
                languages: [en, hi]
                provenance: { source_title: 'Kashmir Life, Dec 2025, quoting the Srinagar ARTO', source_url: 'https://kashmirlife.net', verified_on: '2026-10-22', confidence: low, verified: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tenants/{state}:
    get:
      x-api-id: API-23
      x-proposed: true
      tags: [plan]
      operationId: getTenant
      summary: Public tenant configuration (white-label theme, languages, adapter modes, feature flags)
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/State'
      responses:
        '200':
          description: Tenant
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
              example:
                tenant: JK
                display_name_key: tenant.jk
                languages: [en, hi, doi]
                theme: { primary: '#1F4E79', surface: '#FFFFFF', logo_url: null }
                adapters: { sarathi: deeplink, digilocker: mock, aadhaar_offline: disabled, bhashini: mock, payment: sarathi_redirect, notification: n8n, slot: mock }
                features: { ai_coach: true, voice_guide: true, live_intel: true, school_portal: true, sms: false }
                rule_pack: { pack_id: JK, version: 2026.10.0, base_version: IN-base@2026.10.0 }
                hosting_mode: independent
                disclaimer_key: footer.not_affiliated_simulated_data
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sessions/device:
    post:
      x-api-id: API-06
      x-proposed: true
      tags: [auth]
      operationId: createDeviceSession
      summary: Create an anonymous device session (no PII); web clients receive the opaque `md_sid` cookie (HttpOnly, Secure, SameSite=Lax)
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceSessionRequest' }
            example: { device_public_key: 'MCowBQYDK2VwAyEA3b1...', platform: android_web, app_version: 0.1.0, lite_mode: false }
      responses:
        '201':
          description: Device session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
              example: { scope: anon, subject: dev_01JB8ZA, age_band: unknown, expires_at: '2027-04-21T03:30:00Z', session_token: null }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/magic-link:
    post:
      x-api-id: API-07
      x-proposed: true
      tags: [auth]
      operationId: requestMagicLink
      summary: Email a single-use sign-in link (upgrades the device session to an account)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkRequest' }
            example: { email: kabir@example.com, language: en }
      responses:
        '202':
          description: Link sent if the address is deliverable (response is identical either way to prevent enumeration)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
              example: { status: accepted }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/token:
    post:
      x-api-id: API-08
      x-proposed: true
      tags: [auth]
      operationId: exchangeToken
      summary: Exchange a magic-link code or Google ID token for an account session
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            examples:
              magic:
                value: { grant_type: magic_link, code: ml_7Q2..., device_session: dev_01JB8ZA }
              refresh:
                value: { grant_type: google_id_token, id_token: eyJhbGciOiJSUzI1NiJ9... }
      responses:
        '200':
          description: Session upgraded to an account (web - Set-Cookie md_sid rotated; non-browser clients get session_token). The device session's data is merged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
              example: { scope: user, subject: usr_01JB8ZB, age_band: adult, expires_at: '2027-04-21T03:30:00Z', session_token: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout:
    post:
      x-api-id: API-09
      x-proposed: true
      tags: [auth]
      operationId: logout
      summary: Revoke tokens; with clear_device=true also wipes local drafts (EC-14 "clear this device")
      security:
        - deviceSession: []
        - userBearer: [user]
        - userBearer: [helper]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clear_device: { type: boolean, default: false }
                all_sessions: { type: boolean, default: false }
      responses:
        '204': { description: Logged out }

  /v1/helper-links:
    post:
      x-api-id: API-58
      x-proposed: true
      tags: [auth]
      operationId: createHelperLink
      summary: Applicant invites a helper (family member or CSC operator) with recorded consent
      security:
        - userBearer: [user]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HelperLinkCreate' }
            example:
              case_id: cas_01JB8ZC
              helper_kind: family
              permissions: [case.read, case.write_answers, learn.read]
              expires_in_days: 30
              consent: { purpose: helper_link, notice_version: notice-2026.10.23-hi, granted: true }
      responses:
        '201':
          description: Link created; share the invite code with the helper
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelperLink' }
              example:
                helper_link_id: hlp_01JB8ZD
                case_id: cas_01JB8ZC
                helper_kind: family
                permissions: [case.read, case.write_answers, learn.read]
                status: pending
                invite_code: MD-7K4Q-92
                expires_at: '2026-11-23T00:00:00Z'
                consent_id: cns_01JB8ZD
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      x-api-id: API-58
      x-proposed: true
      tags: [auth]
      operationId: listHelperLinks
      summary: List helper links where the caller is applicant or helper
      security:
        - userBearer: [user]
        - userBearer: [helper]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Links
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelperLinkPage' }
  /v1/helper-links/{helperLinkId}:
    delete:
      x-api-id: API-58
      x-proposed: true
      tags: [auth]
      operationId: revokeHelperLink
      summary: Revoke a helper link (EC-25); helper tokens stop working within 60 s
      security:
        - userBearer: [user]
        - userBearer: [helper]
      parameters:
        - name: helperLinkId
          in: path
          required: true
          schema: { type: string, pattern: '^hlp_[0-9A-Z]{6,26}$' }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cases:
    post:
      x-api-id: API-10
      tags: [cases]
      operationId: createCase
      summary: Start a licence case from a plan (anonymous device session allowed)
      security:
        - deviceSession: []
        - userBearer: [user]
        - userBearer: [helper]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseCreate' }
            examples:
              fromPlan:
                value: { plan_id: pln_01JB8Z6X3V9Q2K7M4N5P6R7S8T, classes: [MCWG, LMV-NT], path: aadhaar_contactless }
              midJourney:
                summary: EC-22 user already holds an LL
                value:
                  plan_id: pln_01JB8Z6X3V9Q2K7M4N5P6R7S8T
                  classes: [MCWG]
                  path: aadhaar_contactless
                  existing_ll: { issued_on: '2026-09-10', expires_on: '2027-03-09', classes: [MCWG], number_last4: '4471' }
      responses:
        '201':
          description: Case created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/cases/{caseId}:
    get:
      x-api-id: API-11
      tags: [cases]
      operationId: getCase
      summary: Get a case with its stage and single next action
      security:
        - deviceSession: []
        - userBearer: [user]
        - userBearer: [helper]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
              example:
                case_id: cas_01JB8ZC
                tenant: JK
                state: BRIDGE
                stage: S4
                display_stage: BRIDGE
                alerts: []
                path: aadhaar_contactless
                classes:
                  - { class_code: MCWG, status: ll_issued }
                  - { class_code: LMV-NT, status: ll_issued }
                answers: { residence_district: Jammu, vehicle_owned: false, preferred_office_id: off_jk02 }
                ll: { issued_on: '2026-10-24', expires_on: '2027-04-23', classes: [MCWG, LMV-NT], number_last4: '4471', source: user_entered }
                dl: null
                key_dates: { dl_test_unlock: '2026-11-23', ll_expiry: '2027-04-23', turns_40_on: null }
                next_action: { action_id: PRACTISE_NAZAR, stage: S4, title_key: next.practise_hazard, due_at: null, deep_link: /bridge/play/nazar }
                rule_pack_version: 2026.10.0
                version: 14
                flags: [helper_linked]
                server_time: '2026-11-05T04:12:00Z'
                created_at: '2026-10-24T03:31:00Z'
                updated_at: '2026-11-05T04:11:58Z'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
