# pnpm workspaces for Margdarshak (TypeScript side of the monorepo; Turborepo runs the pipelines).
# The API (services/api) is Go and is managed by the Go toolchain, not pnpm (ADR-0011, BUILD_CONVENTIONS §1).
packages:
  - "apps/*" # @margdarshak/web (citizen PWA), @margdarshak/console
  - "packages/*" # @margdarshak/ui, game-core, rules (zero-dep TS mirror), api-client
  - "services/score-verifier" # Node replay service importing @margdarshak/game-core
  - "services/workflows" # Render Workflows tasks (TS SDK)
  - "tests/e2e" # @margdarshak/e2e (Playwright + axe)

# pnpm 11 build-script allowlist (replaces package.json "pnpm.onlyBuiltDependencies").
# lefthook is deliberately not allowed: install hooks explicitly with `pnpm exec lefthook install`.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  sharp: true
  "@parcel/watcher": true
  unrs-resolver: true
  "@swc/core": false
  lefthook: false
  "@google/genai": false
  protobufjs: false

# Several pins below were published in the week of 2026-10-23; keep the release-age gate off for the
# build and turn it on (4320 = 3 days) in Phase 3.
minimumReleaseAge: 0

# Shared exact versions for packages used by several workspaces (pnpm catalogs).
# Workspaces reference them as "catalog:" so upgrades happen in one place. Re-pinned 2026-10-23 (MD-008).
catalog:
