# Margdarshak CI: every push to main and every PR.
# Three independent jobs, so one failure never hides another:
#   web       TypeScript lint, copy/i18n lints, typecheck, every workspace's tests, Next.js build
#   api       Go fmt, vet, golangci-lint, every Go test (embedded PostgreSQL 16, no Docker)
#   security  secret scan, Go and npm vulnerability checks
# Model evals cost API credits, so they run on demand only (evals.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  NODE_VERSION: "22"

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format)
        run: pnpm lint:biome
      - name: Copy lints (banned wording, fee literals, dark patterns) and i18n parity
        run: pnpm lint:facts && pnpm lint:patterns && pnpm lint:i18n
      - name: Typecheck every workspace
        run: pnpm -r --if-present typecheck
      - name: Tests in every workspace (web, rules mirror, game-core, score verifier, workflows, ...)
        run: pnpm -r --if-present test
      - name: Next.js production build
        run: pnpm --filter @margdarshak/web build

  api:
    name: api (go fmt, vet, lint, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod # honours the toolchain line
          cache-dependency-path: services/api/go.sum
      # Some Go tests run TypeScript (the score verifier contract, the clip-pipeline cross-check).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: pnpm install (for the Go tests that start Node)
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-pg16-${{ runner.os }}-${{ hashFiles('services/api/go.sum') }}
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: services/api
          args: --timeout=5m
      - name: go test (unit, golden rules, adapter contracts, API on embedded Postgres 16)
        env:
          RULEPACK_DIR: ${{ github.workspace }}/rulepacks
        run: go test -count=1 ./...

  security:
    name: security (secrets, vulnerable deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (whole history; known false positives in .github/gitleaks.toml)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --config .github/gitleaks.toml --redact --no-banner .
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: govulncheck (Go deps + standard library)
        working-directory: services/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (production deps, high and above)
        run: pnpm audit --prod --audit-level high
